<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>청인마루 재고 관리</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  body { font-family:'Pretendard Variable','Noto Sans KR',sans-serif; background:#f1f5f9; color:#0f172a; -webkit-tap-highlight-color:transparent; }
  .premium-shadow { box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 32px -12px rgba(15,23,42,.12); }
  .input-premium { width:100%; padding:12px 14px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; font-weight:700; color:#334155; outline:none; }
  .input-premium:focus { background:#fff; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.1); }
  #login-gate { display:flex; position:fixed; inset:0; background:#0f172a; z-index:999; align-items:center; justify-content:center; }
  #toast { visibility:hidden; min-width:200px; background:#334155; color:#fff; text-align:center; border-radius:50px; padding:12px 24px; position:fixed; z-index:1000; left:50%; bottom:100px; transform:translateX(-50%); font-size:14px; font-weight:700; }
  #toast.show { visibility:visible; animation:fadein .3s, fadeout .3s 1.7s; }
  @keyframes fadein { from{opacity:0} to{opacity:1} }
  @keyframes fadeout { from{opacity:1} to{opacity:0} }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:900; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}
</style>
</head>
<body class="antialiased">

<div id="toast">저장되었습니다</div>

<div id="login-gate">
  <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-sm text-center mx-4">
    <h2 class="text-xl font-black text-slate-900 mb-1">청인마루 재고 관리</h2>
    <p class="text-xs text-slate-400 font-bold mb-1">Stock System</p>
    <p id="fb-badge" class="text-[9px] font-bold text-slate-300 mb-6">연결 확인 중...</p>
    <input type="password" id="app-password" class="w-full p-4 bg-slate-100 rounded-xl text-center text-lg font-black outline-none focus:ring-2 ring-blue-500 mb-4" placeholder="PASSWORD" onkeyup="if(event.keyCode==13) checkLogin()">
    <button onclick="checkLogin()" class="w-full py-4 bg-slate-900 text-white rounded-xl font-black text-lg">접속하기</button>
  </div>
</div>

<div id="log-modal" class="modal-overlay">
  <div class="bg-white rounded-[1.5rem] w-full max-w-lg mx-4 h-[80vh] flex flex-col overflow-hidden">
    <div class="p-4 border-b flex justify-between items-center bg-slate-50">
      <h3 class="font-black text-slate-900"><i class="fas fa-history text-blue-600 mr-1.5"></i>입출고 기록 <span id="fb-status-badge" class="text-[9px] px-2 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-600 ml-1">실시간 연결됨</span></h3>
      <button onclick="closeModal('log-modal')" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center"><i class="fas fa-times"></i></button>
    </div>
    <div class="p-3 border-b">
      <input type="text" id="log-search" class="input-premium text-sm" placeholder="브랜드/제품/모델 검색..." oninput="renderLog()">
    </div>
    <div class="px-3 pt-2 flex gap-2">
      <button id="log-tab-active" onclick="setLogTab('active')" class="flex-1 py-2 rounded-lg text-xs font-black bg-slate-900 text-white">전체 기록</button>
      <button id="log-tab-trash" onclick="setLogTab('trash')" class="flex-1 py-2 rounded-lg text-xs font-black bg-slate-100 text-slate-400"><i class="fas fa-trash-can mr-1"></i>휴지통</button>
    </div>
    <div id="log-list" class="p-3 overflow-y-auto flex-1 space-y-2 bg-slate-50/50"></div>
  </div>
</div>

<!-- 거래처 관리 모달 -->
<div id="vendor-modal" class="modal-overlay">
  <div class="bg-white rounded-[1.5rem] w-full max-w-lg mx-4 h-[85vh] flex flex-col overflow-hidden">
    <div class="p-4 border-b flex justify-between items-center bg-slate-50">
      <h3 class="font-black text-slate-900"><i class="fas fa-address-book text-blue-600 mr-1.5"></i>거래처 관리</h3>
      <button onclick="closeModal('vendor-modal')" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center"><i class="fas fa-times"></i></button>
    </div>

    <!-- 거래처 목록 화면 -->
    <div id="vendor-list-view" class="flex-1 flex flex-col overflow-hidden">
      <div class="p-3 border-b space-y-2">
        <input type="text" id="vendor-search" class="input-premium text-sm" placeholder="거래처명 검색..." oninput="renderVendorList()">
        <button onclick="showVendorForm()" class="w-full py-2.5 bg-blue-600 text-white rounded-xl text-sm font-black"><i class="fas fa-plus mr-1"></i> 새 거래처 추가</button>
      </div>
      <div id="vendor-list" class="p-3 overflow-y-auto flex-1 space-y-2 bg-slate-50/50"></div>
    </div>

    <!-- 새 거래처 입력 화면 -->
    <div id="vendor-form-view" class="hidden flex-1 flex flex-col overflow-hidden">
      <div class="p-4 overflow-y-auto flex-1 space-y-3">
        <button onclick="hideVendorForm()" class="text-xs font-bold text-slate-400"><i class="fas fa-arrow-left mr-1"></i> 목록으로</button>
        <div><label class="text-[10px] font-black text-slate-400 pl-1">거래처명</label><input type="text" id="vf-name" class="input-premium mt-1" placeholder="예: OO인테리어"></div>
        <div><label class="text-[10px] font-black text-slate-400 pl-1">담당자/연락처</label><input type="text" id="vf-phone" class="input-premium mt-1" placeholder="이름 010-0000-0000"></div>
        <div><label class="text-[10px] font-black text-slate-400 pl-1">주소</label><input type="text" id="vf-addr" class="input-premium mt-1" placeholder="선택 입력"></div>
        <div><label class="text-[10px] font-black text-slate-400 pl-1">메모</label><input type="text" id="vf-memo" class="input-premium mt-1" placeholder="선택 입력"></div>
        <button onclick="saveVendor()" class="w-full py-3.5 bg-blue-600 text-white rounded-xl text-sm font-black"><i class="fas fa-save mr-1"></i> 저장</button>
      </div>
    </div>

    <!-- 거래처 상세(타임라인) 화면 -->
    <div id="vendor-detail-view" class="hidden flex-1 flex flex-col overflow-hidden">
      <div class="p-4 border-b space-y-1">
        <button onclick="hideVendorDetail()" class="text-xs font-bold text-slate-400 mb-1"><i class="fas fa-arrow-left mr-1"></i> 목록으로</button>
        <h4 id="vd-name" class="text-lg font-black text-slate-900">-</h4>
        <p id="vd-phone" class="text-[12px] text-slate-500 font-bold"></p>
        <p id="vd-addr" class="text-[12px] text-slate-400"></p>
        <p id="vd-memo" class="text-[12px] text-slate-400 italic"></p>
      </div>
      <div class="p-3 border-b bg-slate-50 space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <select id="vl-type" class="input-premium text-sm">
            <option value="샘플북 전달">샘플북 전달</option>
            <option value="방문">방문</option>
            <option value="전화 통화">전화 통화</option>
            <option value="기타">기타</option>
          </select>
          <input type="date" id="vl-date" class="input-premium text-sm">
        </div>
        <input type="text" id="vl-note" class="input-premium text-sm" placeholder="메모 (예: 노바마루 신제품 샘플북 전달)">
        <button onclick="addVendorLog()" class="w-full py-2.5 bg-slate-900 text-white rounded-xl text-sm font-black"><i class="fas fa-plus mr-1"></i> 기록 추가</button>
      </div>
      <div id="vendor-timeline" class="p-3 overflow-y-auto flex-1 space-y-2 bg-white"></div>
    <div class="p-2 border-t bg-slate-50">
      <button onclick="toggleVendorLogTrash()" id="vendor-trash-toggle-btn" class="w-full py-2 text-xs font-black text-slate-400"><i class="fas fa-trash-can mr-1"></i>삭제된 기록 보기 (복구 가능)</button>
    </div>
    </div>
  </div>
</div>

<div class="max-w-2xl mx-auto p-4 md:p-6">

  <header class="bg-white rounded-2xl premium-shadow px-4 py-3 flex items-center justify-between mb-5">
    <div>
      <h1 class="text-lg font-black text-slate-900">청인마루<span class="text-blue-600">.</span> 재고관리</h1>
      <p class="text-[10px] text-slate-400 font-bold">Stock System · 실시간 공유 <span id="debug-count" class="text-blue-400"></span></p>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="exportBackup()" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-500 hover:text-emerald-600 flex items-center justify-center" title="전체 데이터 백업"><i class="fas fa-download"></i></button>
      <button onclick="loadMasterCSV(true)" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-500 hover:text-blue-600 flex items-center justify-center" title="품목목록 새로고침"><i class="fas fa-sync-alt"></i></button>
      <button onclick="openVendorModal()" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-500 hover:text-blue-600 flex items-center justify-center" title="거래처 관리"><i class="fas fa-address-book"></i></button>
      <button onclick="openLogModal()" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-500 hover:text-blue-600 flex items-center justify-center" title="입출고 기록"><i class="fas fa-list-ul"></i></button>
    </div>
  </header>

  <div class="bg-white rounded-[2rem] p-5 premium-shadow space-y-4 mb-5">
    <div class="grid grid-cols-3 bg-slate-900 p-1 rounded-2xl gap-1">
      <button id="type-in" class="py-3 rounded-xl text-[13px] font-black text-white bg-blue-600" onclick="setType('입고')"><i class="fas fa-arrow-down mr-1"></i>입고</button>
      <button id="type-out" class="py-3 rounded-xl text-[13px] font-black text-slate-400" onclick="setType('출고')"><i class="fas fa-arrow-up mr-1"></i>출고</button>
      <button id="type-return" class="py-3 rounded-xl text-[13px] font-black text-slate-400" onclick="setType('반품')"><i class="fas fa-rotate-left mr-1"></i>반품</button>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <select id="sel-brand" class="input-premium" onchange="updateProducts()"></select>
      <select id="sel-product" class="input-premium" onchange="updateModels()"></select>
    </div>
    <select id="sel-model" class="input-premium" onchange="onModelChange(); autoFillCostPrice();"></select>

    <div class="grid grid-cols-2 gap-2.5">
      <div><label class="text-[10px] font-black text-slate-400 pl-1">로트번호</label><input type="text" id="in-lot" class="input-premium mt-1" placeholder="예: L20260819-01" oninput="onModelChange()"></div>
      <div><label class="text-[10px] font-black text-slate-400 pl-1">생산일자</label><input type="date" id="in-prod-date" class="input-premium mt-1"></div>
    </div>

    <div id="current-stock-box" class="hidden bg-emerald-50 border border-emerald-100 rounded-xl px-4 py-2.5 flex justify-between items-center">
      <span class="text-[11px] font-black text-emerald-700"><i class="fas fa-warehouse mr-1"></i><span id="current-stock-label">현재 재고</span></span>
      <span id="current-stock-val" class="text-sm font-black text-emerald-600">-</span>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <div><label class="text-[10px] font-black text-slate-400 pl-1">수량 (박스)</label><input type="number" id="in-qty" class="input-premium mt-1" placeholder="0"></div>
      <div></div>
    </div>
    <div id="price-field" class="grid grid-cols-2 gap-2.5">
      <div><label class="text-[10px] font-black text-slate-400 pl-1">매입단가(VAT별도) <span class="text-blue-400 font-medium">· 원가자동</span></label><input type="text" id="in-price" class="input-premium mt-1" placeholder="0" oninput="formatMoney(this); syncPriceFromExVat();"></div>
      <div><label class="text-[10px] font-black text-slate-400 pl-1">매입단가(VAT포함)</label><input type="text" id="in-price-vat" class="input-premium mt-1" placeholder="0" oninput="formatMoney(this); syncPriceFromIncVat();"></div>
    </div>
    <div class="grid grid-cols-2 gap-2.5">
      <div><label class="text-[10px] font-black text-slate-400 pl-1">거래처</label><input type="text" id="in-vendor" class="input-premium mt-1" placeholder="동화자연마루 등"></div>
      <div><label class="text-[10px] font-black text-slate-400 pl-1">날짜</label><input type="date" id="in-date" class="input-premium mt-1"></div>
    </div>
    <div><label class="text-[10px] font-black text-slate-400 pl-1">메모 <span id="memo-hint" class="text-slate-300 font-medium"></span></label><input type="text" id="in-memo" class="input-premium mt-1" placeholder="선택 입력 (반품 사유 등)"></div>

    <button onclick="submitMovement()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-base shadow-lg shadow-blue-100 active:scale-95 transition-transform">
      <i class="fas fa-save mr-1.5"></i> 저장 (모든 기기에 즉시 반영)
    </button>
    <div id="save-status" class="text-center text-xs font-bold py-1"></div>
  </div>

  <div class="bg-white rounded-[2rem] p-5 premium-shadow">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-sm font-black text-slate-800"><i class="fas fa-boxes-stacked text-blue-500 mr-1.5"></i>재고 현황</h3>
      <span id="stock-count" class="text-[10px] font-bold text-slate-400"></span>
    </div>
    <input type="text" id="stock-search" class="input-premium text-sm mb-3" placeholder="브랜드/제품/모델 검색..." oninput="renderStockList()">
    <div id="stock-list" class="space-y-1.5 max-h-[60vh] overflow-y-auto"></div>
  </div>

</div>

<script>
  // ===== 1) 900개 품목 조회 - 마루견적서(index.html)가 이미 쓰고 있는 공개 링크를 그대로 재사용 =====
  //     읽기 전용 GET 요청이라 견적서/파트너가격 쪽에는 전혀 영향 없음. 새로 만들 것도, 공개 설정할 것도 없음.
  const MASTER_SHEET_URL = "https://script.google.com/macros/s/AKfycbxHU1h6Vu2W5Yovgm8yRJKIoALUdpeLQULRdCKdVMtnER2QewMbFBAn0Q1s30hvtFpP/exec";
  // 매입단가(비밀 단가) 조회용 - 견적서(index.html)의 ADMIN_KEY와 동일해야 시트의 원가 컬럼이 열림
  const ADMIN_KEY = "cm_wondeok_7d3f9k";

  // ===== 2) Firebase - 견적서(index.html)와 동일한 프로젝트를 그대로 재사용 =====
  //     stock_movements 라는 새 저장공간만 씀. quote_history(견적기록)는 전혀 건드리지 않음.
  const firebaseConfig = {
    apiKey: "AIzaSyCHdMgp2clJ0y3L1GR-WubpAYKEVYvLcLA",
    authDomain: "maru-quote-history.firebaseapp.com",
    databaseURL: "https://maru-quote-history-dbb55-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "maru-quote-history",
    storageBucket: "maru-quote-history.firebasestorage.app",
    messagingSenderId: "936179721364",
    appId: "1:936179721364:web:cbf9e9bb6c71970d400081"
  };
  let fbDatabase = null;

  firebase.initializeApp(firebaseConfig);
  fbDatabase = firebase.database();
  let authReady = false;
  firebase.auth().signInAnonymously()
    .then(() => { authReady = true; document.getElementById('fb-badge').innerText = '🟢 실시간 연결됨 (전체 기기 공유)'; })
    .catch(err => {
      console.error('Firebase 인증 실패', err);
      document.getElementById('fb-badge').innerText = '🔴 연결 실패: ' + (err && err.code ? err.code : err);
      showToast('⚠️ 로그인 연결 실패: ' + (err && err.code ? err.code : err), true);
    });

  let masterData = {}; // { brand: { product: [model,...] } }
  let costDataMap = {}; // { "brand||name||model": {ex, inc} } - 매입단가(비밀 단가), VAT별도/포함
  let movements = {};  // { fbKey: {날짜,구분,brand,name,model,수량,단가,거래처,메모} }
  let stockSummary = [];
  let currentType = '입고';

  window.onload = function() {
    document.getElementById('in-date').value = new Date().toISOString().slice(0,10);
    if (localStorage.getItem('cm_stock_auth') === 'valid') {
      document.getElementById('login-gate').style.display = 'none';
      init();
    }
  };

  function checkLogin() {
    if (btoa(document.getElementById('app-password').value) === 'MTMwNg==') { // 1306
      localStorage.setItem('cm_stock_auth', 'valid');
      document.getElementById('login-gate').style.display = 'none';
      init();
    } else { alert('비밀번호 오류'); }
  }

  function init() {
    loadMasterCSV(false);
    loadCostData();
    setType('입고');
    checkBackupReminder();
    // 실시간 리스너: 다른 기기에서 저장/삭제하면 여기도 즉시 자동 갱신됨
    fbDatabase.ref('stock_movements').on('value', snap => {
      movements = snap.val() || {};
      recalcStockSummary();
      renderStockList();
      onModelChange();
      const dbg = document.getElementById('debug-count');
      if (dbg) dbg.innerText = `(서버상 ${Object.keys(movements).length}건)`;
      if (document.getElementById('log-modal').style.display === 'flex') renderLog();
    }, err => {
      const dbg = document.getElementById('debug-count');
      if (dbg) dbg.innerText = '(읽기 실패: ' + err.code + ')';
    });
  }

  // ===== ① 정기 백업 =====
  function checkBackupReminder() {
    const last = parseInt(localStorage.getItem('cm_stock_last_backup') || '0');
    const days = (Date.now() - last) / (1000*60*60*24);
    if (!last || days > 14) {
      setTimeout(() => showToast('⚠️ 백업한 지 오래됐어요. 상단 다운로드 버튼으로 백업해주세요'), 1200);
    }
  }

  async function exportBackup() {
    showToast('백업 파일 생성 중...');
    try {
      const [mv, mvTrash, vd, vdTrash, vl, vlTrash] = await Promise.all([
        fbDatabase.ref('stock_movements').once('value'),
        fbDatabase.ref('stock_movements_trash').once('value'),
        fbDatabase.ref('vendors').once('value'),
        fbDatabase.ref('vendors_trash').once('value'),
        fbDatabase.ref('vendor_logs').once('value'),
        fbDatabase.ref('vendor_logs_trash').once('value')
      ]);
      const backup = {
        backupDate: new Date().toISOString(),
        stock_movements: mv.val() || {},
        stock_movements_trash: mvTrash.val() || {},
        vendors: vd.val() || {},
        vendors_trash: vdTrash.val() || {},
        vendor_logs: vl.val() || {},
        vendor_logs_trash: vlTrash.val() || {}
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `청인마루_재고백업_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      localStorage.setItem('cm_stock_last_backup', String(Date.now()));
      showToast('백업 완료! 다운로드 폴더를 확인하세요');
    } catch(e) { showToast('백업 실패'); }
  }

  // ===== 매입단가(비밀 단가) 불러오기 - 견적서 관리패널과 같은 데이터, 로그인(1306)한 직원은 바로 조회됨 =====
  async function loadCostData() {
    try {
      const res = await fetch(`${MASTER_SHEET_URL}?k=${encodeURIComponent(ADMIN_KEY)}`);
      let jsonData = await res.json();
      jsonData = fillMergedCells(jsonData);
      costDataMap = {};
      jsonData.forEach(item => {
        const brand = String(item.brand || '').trim();
        const name = String(item.name || '').trim();
        const model = String(item.model || '').trim();
        const exVatKey = Object.keys(item).find(k => k.replace(/\s/g,'') === '원가(vat미포함)' || k.replace(/\s/g,'') === '원가(vat별도)');
        const incVatKey = Object.keys(item).find(k => k.replace(/\s/g,'') === '원가(vat포함)');
        const costEx = parseInt(String(item.cost ?? item.cost_ex_vat ?? item['원가'] ?? (exVatKey ? item[exVatKey] : '') ?? '').replace(/,/g,'')) || 0;
        const costInc = parseInt(String(item.cost_inc_vat ?? item.cost_vat ?? (incVatKey ? item[incVatKey] : '') ?? '').replace(/,/g,'')) || 0;
        if (!brand || !name) return;
        const key = `${brand}||${name}||${model}`;
        if (costEx || costInc) costDataMap[key] = { ex: costEx, inc: costInc };
      });
    } catch(e) { /* 원가 조회 실패해도 재고 입력 자체는 계속 가능하게 조용히 무시 */ }
  }

  function getCostPriceFor(brand, name, model) {
    return costDataMap[`${brand}||${name}||${model}`] || costDataMap[`${brand}||${name}||`] || null;
  }

  // ===== VAT별도 <-> VAT포함 상호 자동계산 (한쪽 수정하면 다른쪽도 즉시 갱신) =====
  function syncPriceFromExVat() {
    const ex = parseInt((document.getElementById('in-price').value||'0').replace(/,/g,'')) || 0;
    document.getElementById('in-price-vat').value = ex ? Math.round(ex * 1.1).toLocaleString() : '';
  }
  function syncPriceFromIncVat() {
    const inc = parseInt((document.getElementById('in-price-vat').value||'0').replace(/,/g,'')) || 0;
    document.getElementById('in-price').value = inc ? Math.round(inc / 1.1).toLocaleString() : '';
  }

  // ===== 900개 품목 읽기 (읽기 전용 GET, 구글시트 원본/견적서에 아무 영향 없음) =====
  // 마루견적서와 동일한 병합셀 처리(fillMergedCells) 로직을 그대로 적용해 brand/name이 빈 칸인 행도 정상 인식
  function fillMergedCells(jsonData) {
    const lastValues = {};
    return jsonData.map(row => {
      const hasAnyValue = Object.values(row).some(v => v !== undefined && v !== null && String(v).trim() !== '');
      if (!hasAnyValue) return row;
      const filled = { ...row };
      ['brand', 'name'].forEach(key => {
        const val = filled[key];
        const isEmpty = val === undefined || val === null || String(val).trim() === '';
        if (isEmpty) { if (lastValues[key] !== undefined) filled[key] = lastValues[key]; }
        else { lastValues[key] = val; }
      });
      return filled;
    });
  }

  async function loadMasterCSV(showMsg) {
    try {
      const res = await fetch(MASTER_SHEET_URL);
      let jsonData = await res.json();
      jsonData = fillMergedCells(jsonData);
      masterData = {};
      jsonData.forEach(item => {
        const brand = String(item.brand || '').trim();
        const name = String(item.name || '').trim();
        const model = String(item.model || '').trim();
        const category = String(item.category ?? item['구분'] ?? '바닥재').trim();
        // 철거단가표 행, 벽장재 행은 재고 대상에서 제외 (마루 위주로 관리)
        if (category.includes('철거') || category.includes('벽')) return;
        if (!brand || !name || !model) return;
        if (!masterData[brand]) masterData[brand] = {};
        if (!masterData[brand][name]) masterData[brand][name] = [];
        if (!masterData[brand][name].includes(model)) masterData[brand][name].push(model);
      });
      renderBrandSelect();
      if (showMsg) showToast('품목 목록 업데이트 완료');
    } catch(e) { showToast('품목 목록 불러오기 실패'); }
  }

  function renderBrandSelect() {
    const sel = document.getElementById('sel-brand');
    const prev = sel.value;
    sel.innerHTML = '<option value="">브랜드 선택</option>';
    Object.keys(masterData).sort().forEach(b => sel.add(new Option(b,b)));
    if (prev && masterData[prev]) sel.value = prev;
    updateProducts();
  }

  function updateProducts() {
    const b = document.getElementById('sel-brand').value;
    const sel = document.getElementById('sel-product');
    sel.innerHTML = '<option value="">제품 선택</option>';
    if (b && masterData[b]) Object.keys(masterData[b]).forEach(n => sel.add(new Option(n,n)));
    updateModels();
  }

  function updateModels() {
    const b = document.getElementById('sel-brand').value;
    const p = document.getElementById('sel-product').value;
    const sel = document.getElementById('sel-model');
    sel.innerHTML = '<option value="">색상/모델 선택</option>';
    if (b && p && masterData[b] && masterData[b][p]) masterData[b][p].forEach(m => sel.add(new Option(m,m)));
    onModelChange();
    autoFillCostPrice();

  function autoFillCostPrice() {
    if (currentType !== '입고') return;
    const b = document.getElementById('sel-brand').value;
    const p = document.getElementById('sel-product').value;
    const m = document.getElementById('sel-model').value;
    if (!b || !p) return;
    const cost = getCostPriceFor(b, p, m);
    if (!cost) return;
    const ex = cost.ex || (cost.inc ? Math.round(cost.inc / 1.1) : 0);
    const inc = cost.inc || (cost.ex ? Math.round(cost.ex * 1.1) : 0);
    document.getElementById('in-price').value = ex ? ex.toLocaleString() : '';
    document.getElementById('in-price-vat').value = inc ? inc.toLocaleString() : '';
  }

  function onModelChange() {
    const b = document.getElementById('sel-brand').value;
    const p = document.getElementById('sel-product').value;
    const m = document.getElementById('sel-model').value;
    const lot = (document.getElementById('in-lot').value || '').trim();
    const box = document.getElementById('current-stock-box');
    if (!b || !p || !m) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    if (lot) {
      const found = stockSummary.find(s => s.brand===b && s.name===p && s.model===m && s.lot===lot);
      const stock = found ? found.stock : 0;
      document.getElementById('current-stock-label').innerText = `현재 재고 (로트: ${lot})`;
      document.getElementById('current-stock-val').innerText = stock.toLocaleString() + ' BOX';
      document.getElementById('current-stock-val').className = 'text-sm font-black ' + (stock <= 0 ? 'text-rose-500' : 'text-emerald-600');
    } else {
      const total = stockSummary.filter(s => s.brand===b && s.name===p && s.model===m).reduce((a,s)=>a+s.stock,0);
      document.getElementById('current-stock-label').innerText = '현재 재고 (전체 로트 합계)';
      document.getElementById('current-stock-val').innerText = total.toLocaleString() + ' BOX';
      document.getElementById('current-stock-val').className = 'text-sm font-black ' + (total <= 0 ? 'text-rose-500' : 'text-emerald-600');
    }
  }

  // ===== Firebase 실시간 데이터를 기반으로 brand+name+model+로트번호별 현재재고 재계산 =====
  function recalcStockSummary() {
    const map = {};
    Object.values(movements).forEach(r => {
      if (!r.brand || !r.name || !r.model) return;
      const lot = r.lot || '';
      const key = `${r.brand}||${r.name}||${r.model}||${lot}`;
      if (!map[key]) map[key] = { brand:r.brand, name:r.name, model:r.model, lot, prodDate:r.prodDate||'', stock:0 };
      const qty = Number(r.qty) || 0;
      if (r.type === '입고') map[key].stock += qty;
      else if (r.type === '출고' || r.type === '반품') map[key].stock -= qty;
      if (r.type === '입고' && r.prodDate) map[key].prodDate = r.prodDate; // 최근 입고 기준 생산일자 표시
    });
    stockSummary = Object.values(map).sort((a,b) => a.stock - b.stock);
  }

  function renderStockList() {
    const q = (document.getElementById('stock-search').value || '').toLowerCase();
    const box = document.getElementById('stock-list');
    const filtered = stockSummary.filter(s => !q || (s.brand+s.name+s.model).toLowerCase().includes(q));
    document.getElementById('stock-count').innerText = `${filtered.length}개 품목`;
    box.innerHTML = '';
    if (!filtered.length) { box.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">기록이 없습니다</div>'; return; }
    filtered.forEach(s => {
      const low = s.stock <= 0;
      const row = document.createElement('div');
      row.className = 'flex justify-between items-center px-3 py-2.5 rounded-xl border ' + (low ? 'bg-rose-50 border-rose-100' : 'bg-slate-50 border-slate-100');
      row.innerHTML = `
        <div class="min-w-0 flex-1">
          <p class="text-[10px] font-bold text-slate-400">${s.brand} · ${s.name}</p>
          <p class="text-sm font-black text-slate-800 truncate">${s.model}</p>
          <p class="text-[10px] text-slate-400 font-bold mt-0.5">${s.lot ? ('로트: '+s.lot) : '로트 미기재'}${s.prodDate ? (' · 생산일 '+s.prodDate) : ''}</p>
        </div>
        <span class="text-base font-black ${low ? 'text-rose-500' : 'text-slate-800'} shrink-0 ml-2">${s.stock.toLocaleString()} <span class="text-[10px] font-bold">BOX</span></span>
      `;
      box.appendChild(row);

  function setSaveStatus(msg, ok) {
    const el = document.getElementById('save-status');

  function submitMovement() {
    const brand = document.getElementById('sel-brand').value;
    const name = document.getElementById('sel-product').value;
    const model = document.getElementById('sel-model').value;
    const qty = parseFloat(document.getElementById('in-qty').value) || 0;
    if (!brand || !name || !model) { showToast('브랜드/제품/모델을 선택하세요'); setSaveStatus('❌ 브랜드/제품/모델을 선택하세요', false); return; }
    if (qty <= 0) { showToast('수량을 입력하세요'); setSaveStatus('❌ 수량을 입력하세요', false); return; }
    if (currentType === '반품' && !document.getElementById('in-memo').value.trim()) { showToast('반품 사유를 메모에 적어주세요'); setSaveStatus('❌ 반품 사유를 메모에 적어주세요', false); return; }
    if (!authReady) { showToast('⚠️ 아직 서버 연결 중입니다. 5초 후 다시 눌러주세요', true); setSaveStatus('⏳ 서버 연결 중... 5초 후 다시 눌러주세요', false); return; }

    setSaveStatus('저장 중...', true);

    const record = {
      date: document.getElementById('in-date').value,
      type: currentType,
      brand, name, model,
      lot: document.getElementById('in-lot').value.trim(),
      prodDate: document.getElementById('in-prod-date').value,
      qty,
      price: parseInt((document.getElementById('in-price').value||'0').replace(/,/g,'')) || 0,
      priceIncVat: parseInt((document.getElementById('in-price-vat').value||'0').replace(/,/g,'')) || 0,
      vendor: document.getElementById('in-vendor').value,
      memo: document.getElementById('in-memo').value,
      ts: Date.now()
    };

    fbDatabase.ref('stock_movements').push(record).then(() => {
      showToast(currentType + ' 저장 완료 (전체 기기 즉시 반영)', true);
      setSaveStatus('✅ ' + new Date().toLocaleTimeString() + ' 저장 완료', true);
      document.getElementById('in-qty').value = '';
      document.getElementById('in-price').value = '';
      document.getElementById('in-price-vat').value = '';
      document.getElementById('in-vendor').value = '';
      document.getElementById('in-memo').value = '';
      document.getElementById('in-lot').value = '';
      document.getElementById('in-prod-date').value = '';
    }).catch((err) => {
      const msg = '저장 실패: ' + (err && err.message ? err.message : err);
      showToast(msg, true);
      setSaveStatus('❌ ' + msg, false);
    });
  }

  let logTab = 'active';
  let movementsTrash = {};
  function setLogTab(tab) {

    document.getElementById('log-tab-trash').className = 'flex-1 py-2 rounded-lg text-xs font-black ' + (tab==='trash' ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-400') + ' flex items-center justify-center';

  function renderLog() {
    const q = (document.getElementById('log-search').value || '').toLowerCase();
    const box = document.getElementById('log-list');
    const source = logTab === 'trash' ? movementsTrash : movements;
    const list = Object.keys(source).map(key => ({ key, ...source[key] }))
      .sort((a,b) => (b.ts||0) - (a.ts||0))
      .filter(r => !q || (r.brand+r.name+r.model).toLowerCase().includes(q));

    if (!list.length) { box.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">${logTab==='trash'?'휴지통이 비어있습니다':'기록이 없습니다'}</div>`; return; }
    list.forEach(r => {
      const badgeStyle = r.type==='입고' ? 'bg-blue-100 text-blue-600' : r.type==='반품' ? 'bg-amber-100 text-amber-600' : 'bg-rose-100 text-rose-600';
      const row = document.createElement('div');

      row.innerHTML = `
        <div class="min-w-0 flex-1">

            <span class="text-[10px] text-slate-400 font-bold">${r.date||''}</span>
          </div>
          <p class="text-sm font-black text-slate-800 truncate">${r.brand} · ${r.name} · ${r.model}</p>
          <p class="text-[11px] text-slate-400 font-bold">${r.qty}BOX ${r.price?('· '+Number(r.price).toLocaleString()+'원(VAT별도)'):''}${r.priceIncVat?(' / '+Number(r.priceIncVat).toLocaleString()+'원(VAT포함)'):''} ${r.vendor?('· '+r.vendor):''}</p>
          <p class="text-[10px] text-slate-300 font-bold">${r.lot?('로트: '+r.lot):''} ${r.prodDate?('· 생산일 '+r.prodDate):''} ${r.memo?('· '+r.memo):''}</p>
        </div>
        ${ logTab === 'trash'
          ? `<div class="flex flex-col gap-1 shrink-0"><button onclick="restoreLog('${r.key}')" class="text-emerald-500 hover:text-emerald-700 text-xs px-2 py-1 bg-emerald-50 rounded-lg font-bold"><i class="fas fa-rotate-left mr-1"></i>복구</button><button onclick="permanentDeleteLog('${r.key}')" class="text-slate-400 hover:text-rose-500 text-[10px] px-2">완전삭제</button></div>`
          : `<button onclick="deleteLog('${r.key}')" class="text-slate-300 hover:text-rose-500 px-2 shrink-0"><i class="fas fa-trash"></i></button>`

  // 삭제 = 휴지통으로 이동 (완전 삭제 아님, 복구 가능)
  function deleteLog(key) {
    if (!confirm('이 기록을 휴지통으로 이동할까요?\\n(휴지통에서 언제든 복구할 수 있습니다)')) return;
    const record = movements[key];
    if (!record) return;
    fbDatabase.ref('stock_movements_trash/' + key).set({ ...record, deletedAt: Date.now() })
      .then(() => fbDatabase.ref('stock_movements/' + key).remove())
      .then(() => showToast('휴지통으로 이동했습니다'))
      .catch((err) => showToast('삭제 실패: ' + (err && err.message ? err.message : err), true));
  }

  function restoreLog(key) {
    const record = movementsTrash[key];
    if (!record) return;
    const { deletedAt, ...clean } = record;
    fbDatabase.ref('stock_movements/' + key).set(clean)
      .then(() => fbDatabase.ref('stock_movements_trash/' + key).remove())
      .then(() => { showToast('복구 완료'); setLogTab('trash'); })
      .catch((err) => showToast('복구 실패: ' + (err && err.message ? err.message : err), true));
  }

  function permanentDeleteLog(key) {
    if (!confirm('완전히 삭제하면 복구할 수 없습니다. 정말 삭제할까요?')) return;
    fbDatabase.ref('stock_movements_trash/' + key).remove()
      .then(() => { showToast('완전 삭제되었습니다'); setLogTab('trash'); })
      .catch((err) => showToast('삭제 실패: ' + (err && err.message ? err.message : err), true));
  }

  function saveVendor() {
    const name = document.getElementById('vf-name').value.trim();
    if (!name) return showToast('거래처명을 입력하세요');
    const record = {
      name,
      phone: document.getElementById('vf-phone').value.trim(),
      addr: document.getElementById('vf-addr').value.trim(),
      memo: document.getElementById('vf-memo').value.trim(),
      ts: Date.now()
    };
    fbDatabase.ref('vendors').push(record).then(() => { showToast('거래처 등록 완료'); showVendorList(); })
      .catch((err) => showToast('저장 실패: ' + (err && err.message ? err.message : err), true));
  }

  function openVendorDetail(key) {
    currentVendorKey = key;
    showingVendorTrash = false;
    document.getElementById('vendor-trash-toggle-btn').innerHTML = '<i class="fas fa-trash-can mr-1"></i>삭제된 기록 보기 (복구 가능)';
    document.getElementById('vendor-list-view').classList.add('hidden');
    document.getElementById('vendor-form-view').classList.add('hidden');
    document.getElementById('vendor-detail-view').classList.remove('hidden');
    document.getElementById('vl-date').value = new Date().toISOString().slice(0,10);
    document.getElementById('vl-note').value = '';
    renderVendorDetail();
  }

  function renderVendorDetail() {
    const v = vendors[currentVendorKey];
    if (!v) { showVendorList(); return; }
    document.getElementById('vd-name').innerText = v.name;
    document.getElementById('vd-phone').innerText = v.phone || '';
    document.getElementById('vd-addr').innerText = v.addr || '';
    document.getElementById('vd-memo').innerText = v.memo || '';

    if (showingVendorTrash) {
      const trashLogs = Object.keys(vendorLogsTrash).filter(k => vendorLogsTrash[k].vendorKey === currentVendorKey)
        .map(k => ({ key:k, ...vendorLogsTrash[k] })).sort((a,b) => (b.ts||0)-(a.ts||0));
      const box = document.getElementById('vendor-timeline');
      box.innerHTML = '';
      if (!trashLogs.length) { box.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">삭제된 기록이 없습니다</div>'; return; }
      trashLogs.forEach(l => {
        const row = document.createElement('div');
        row.className = 'flex gap-3';
        row.innerHTML = `
          <div class="w-1.5 shrink-0 rounded-full bg-slate-200"></div>
          <div class="flex-1 pb-3 border-b border-slate-50">
            <div class="flex justify-between items-start">
              <div><span class="text-[10px] font-black px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-500">${l.type}</span><span class="text-[10px] text-slate-400 font-bold ml-1">${l.date}</span></div>
              <div class="flex gap-1"><button onclick="restoreVendorLog('${l.key}')" class="text-emerald-500 text-[10px] font-bold px-1.5 py-0.5 bg-emerald-50 rounded"><i class="fas fa-rotate-left mr-0.5"></i>복구</button><button onclick="permanentDeleteVendorLog('${l.key}')" class="text-slate-300 hover:text-rose-500 text-[10px] px-1">완전삭제</button></div>
            </div>
            <p class="text-sm font-bold text-slate-500 mt-1">${l.note||''}</p>
          </div>
        `;
        box.appendChild(row);
      });
      return;
    }

    const logs = Object.keys(vendorLogs).filter(k => vendorLogs[k].vendorKey === currentVendorKey)
      .map(k => ({ key:k, ...vendorLogs[k] }))
      .sort((a,b) => (b.ts||0) - (a.ts||0));
    const box = document.getElementById('vendor-timeline');
    box.innerHTML = '';
    if (!logs.length) { box.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">아직 기록이 없습니다</div>'; return; }
    logs.forEach(l => {
      const row = document.createElement('div');
      row.className = 'flex gap-3';
      row.innerHTML = `
        <div class="w-1.5 shrink-0 rounded-full bg-blue-200"></div>
        <div class="flex-1 pb-3 border-b border-slate-50">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-black px-1.5 py-0.5 rounded-full bg-blue-100 text-blue-600">${l.type}</span>
              <span class="text-[10px] text-slate-400 font-bold ml-1">${l.date}</span>
            </div>
            <button onclick="deleteVendorLog('${l.key}')" class="text-slate-300 hover:text-rose-500 text-xs px-1"><i class="fas fa-trash"></i></button>
          </div>
          <p class="text-sm font-bold text-slate-700 mt-1">${l.note||''}</p>
        </div>
      `;
      box.appendChild(row);
    });
  }

  let showingVendorTrash = false;
  let vendorLogsTrash = {};
  function toggleVendorLogTrash() {
    showingVendorTrash = !showingVendorTrash;
    const btn = document.getElementById('vendor-trash-toggle-btn');
    btn.innerHTML = showingVendorTrash ? '<i class="fas fa-arrow-left mr-1"></i>전체 기록으로' : '<i class="fas fa-trash-can mr-1"></i>삭제된 기록 보기 (복구 가능)';
    if (showingVendorTrash) {
      fbDatabase.ref('vendor_logs_trash').once('value').then(snap => { vendorLogsTrash = snap.val() || {}; renderVendorDetail(); });
    } else { renderVendorDetail(); }
  }

  function addVendorLog() {
    if (!currentVendorKey) return;
    const record = {
      vendorKey: currentVendorKey,
      date: document.getElementById('vl-date').value || new Date().toISOString().slice(0,10),
      type: document.getElementById('vl-type').value,
      note: document.getElementById('vl-note').value.trim(),
      ts: Date.now()
    };
    fbDatabase.ref('vendor_logs').push(record).then(() => {
      showToast('기록 저장 완료');
      document.getElementById('vl-note').value = '';
    }).catch((err) => showToast('저장 실패: ' + (err && err.message ? err.message : err), true));
  }

  // 삭제 = 휴지통으로 이동 (복구 가능)
  function deleteVendorLog(key) {
    if (!confirm('이 기록을 휴지통으로 이동할까요?\\n(휴지통에서 언제든 복구할 수 있습니다)')) return;
    fbDatabase.ref('vendor_logs/' + key).once('value').then(snap => {
      const record = snap.val();
      if (!record) return;
      return fbDatabase.ref('vendor_logs_trash/' + key).set({ ...record, deletedAt: Date.now() })
        .then(() => fbDatabase.ref('vendor_logs/' + key).remove());
    }).then(() => showToast('휴지통으로 이동했습니다')).catch((err) => showToast('삭제 실패: ' + (err && err.message ? err.message : err), true));
  }

  function restoreVendorLog(key) {
    const record = vendorLogsTrash[key];
    if (!record) return;
    const { deletedAt, ...clean } = record;
    fbDatabase.ref('vendor_logs/' + key).set(clean)
      .then(() => fbDatabase.ref('vendor_logs_trash/' + key).remove())
      .then(() => { showToast('복구 완료'); toggleVendorLogTrash(); toggleVendorLogTrash(); })
      .catch((err) => showToast('복구 실패: ' + (err && err.message ? err.message : err), true));
  }

  function permanentDeleteVendorLog(key) {
    if (!confirm('완전히 삭제하면 복구할 수 없습니다. 정말 삭제할까요?')) return;
    fbDatabase.ref('vendor_logs_trash/' + key).remove()
      .then(() => { showToast('완전 삭제되었습니다'); fbDatabase.ref('vendor_logs_trash').once('value').then(snap => { vendorLogsTrash = snap.val() || {}; renderVendorDetail(); }); })
      .catch((err) => showToast('삭제 실패: ' + (err && err.message ? err.message : err), true));
  }
</script>
</body>
</html>
