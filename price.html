<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>청인마루 거래처 단가표</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --sub:#64748b;
    --line:#e2e8f0; --accent:#2563eb; --accent-soft:#eff6ff;
    --tag:#f8fafc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Pretendard Variable','Noto Sans KR',sans-serif;
    background:var(--bg); color:var(--ink); letter-spacing:-0.01em;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 0 40px;}

  /* 헤더 */
  header{
    background:linear-gradient(160deg,#1e293b 0%,#0f172a 100%);
    color:#fff; padding:28px 20px 22px; position:sticky; top:0; z-index:10;
  }
  header .brand{font-size:11px; font-weight:800; color:#93c5fd; letter-spacing:.08em; text-transform:uppercase;}
  header h1{margin:4px 0 2px; font-size:20px; font-weight:900;}
  header .meta{display:flex; align-items:center; gap:6px; font-size:12px; color:#94a3b8; font-weight:600;}
  header .meta b{color:#e2e8f0; font-weight:800;}
  header .client-badge{
    display:inline-flex; align-items:center; gap:5px; margin-top:12px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    padding:6px 12px; border-radius:100px; font-size:12px; font-weight:700; color:#cbd5e1;
  }
  header .client-badge b{color:#fff;}

  /* 검색 */
  .search-bar{
    padding:14px 20px; background:var(--bg); position:sticky; top:96px; z-index:9;
  }
  .search-bar input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:#fff; font-size:14px; font-weight:600; outline:none;
  }
  .search-bar input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}

  /* 브랜드 섹션 */
  .brand-group{margin:0 20px 18px;}
  .brand-title{
    display:flex; align-items:center; gap:8px; padding:10px 2px 8px;
    font-size:13px; font-weight:900; color:#334155;
  }
  .brand-title .dot{width:6px; height:6px; border-radius:50%; background:var(--accent);}
  .brand-title .count{margin-left:auto; font-size:11px; font-weight:700; color:var(--sub);}

  /* 패턴 카드 */
  .pattern-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    margin-bottom:8px; overflow:hidden; box-shadow:0 1px 2px rgba(15,23,42,.03);
  }
  .pattern-row{
    display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer;
    user-select:none;
  }
  .pattern-row:active{background:#f8fafc;}
  .pattern-main{flex:1; min-width:0;}
  .pattern-name{font-size:14px; font-weight:800; color:var(--ink); margin-bottom:2px;}
  .pattern-spec{font-size:11px; color:var(--sub); font-weight:600;}
  .pattern-price{text-align:right; white-space:nowrap;}
  .price-num{font-size:16px; font-weight:900; color:var(--accent);}
  .price-unit{font-size:10px; color:var(--sub); font-weight:700;}
  .chev{color:#cbd5e1; font-size:12px; transition:transform .2s; flex-shrink:0;}
  .pattern-card.open .chev{transform:rotate(180deg);}

  .model-panel{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    background:var(--tag); border-top:1px solid transparent;
  }
  .pattern-card.open .model-panel{border-top:1px solid var(--line);}
  .model-inner{padding:12px 14px; display:flex; flex-wrap:wrap; gap:6px;}
  .model-chip{
    font-size:11.5px; font-weight:700; color:#475569; background:#fff;
    border:1px solid var(--line); padding:5px 10px; border-radius:8px;
  }

  /* 하단 안내 */
  .footnote{
    margin:20px 20px 0; padding:14px 16px; background:#fff; border:1px dashed var(--line);
    border-radius:12px; font-size:11.5px; color:var(--sub); font-weight:600; line-height:1.6;
  }
  .empty{text-align:center; padding:60px 20px; color:var(--sub); font-size:13px; font-weight:600;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">CHEONGIN MARU · 거래처 단가</div>
    <h1>청인마루 거래처 단가표</h1>
    <div class="meta">기준일 <b id="baseDate">2026-05-01</b> 적용 중</div>
    <div class="client-badge">거래처: <b id="clientName">-</b> 님 전용 조회 페이지</div>
  </header>

  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="브랜드, 패턴, 모델명으로 검색" oninput="renderList()">
  </div>

  <div id="listRoot"></div>

  <div class="footnote">
    * 표시된 단가는 <b>부가세 별도</b> 금액입니다. 계산서 발행 시 10% 추가됩니다.<br>
    * 패턴을 눌러보면 해당 색상(모델) 목록을 확인할 수 있습니다.<br>
    * 단가 변경 시 이 페이지가 자동으로 최신화되니, 이 링크를 즐겨찾기 해두세요.
  </div>
</div>

<script>
/* ============================================
   실제 데이터 엔드포인트 (Apps Script 거래처용 배포 URL)
   ============================================ */
const FEED_URL = 'https://script.google.com/macros/s/AKfycbzyafI_d2PZiE_AYS4Y5f9uBQjK5ULCxX21hk2Z5BMDcbktNT9NnF8mUb_HhA8hJqy9Fw/exec';

let RAW_DATA = [];
let openState = {};

async function loadData(){
  const root = document.getElementById('listRoot');
  root.innerHTML = '<div class="empty">단가 정보를 불러오는 중입니다...</div>';
  try {
    const res = await fetch(FEED_URL);
    if (!res.ok) throw new Error('네트워크 오류');
    RAW_DATA = await res.json();
    renderList();
  } catch (e) {
    root.innerHTML = '<div class="empty">단가 정보를 불러오지 못했습니다.<br>잠시 후 새로고침 해주세요.</div>';
    console.error(e);
  }
}

function groupByPattern(data){
  const groups = [];
  const map = new Map();
  data.forEach(row => {
    const key = row.brand + '__' + row.name;
    if (!map.has(key)) {
      const g = { brand:row.brand, name:row.name, spec:row.spec, firm_price:row.firm_price, models: row.model ? [row.model] : [] };
      map.set(key, g); groups.push(g);
    } else if (row.model) {
      map.get(key).models.push(row.model);
    }
  });
  return groups;
}

function renderList(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const groups = groupByPattern(RAW_DATA);
  const byBrand = {};
  groups.forEach(g => {
    const hit = !q || g.brand.toLowerCase().includes(q) || g.name.toLowerCase().includes(q) || g.models.some(m => m.toLowerCase().includes(q));
    if (!hit) return;
    (byBrand[g.brand] = byBrand[g.brand] || []).push(g);
  });

  const root = document.getElementById('listRoot');
  const brands = Object.keys(byBrand);
  if (brands.length === 0) { root.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>'; return; }

  root.innerHTML = brands.map(brand => {
    const items = byBrand[brand];
    return `
      <div class="brand-group">
        <div class="brand-title"><span class="dot"></span>${brand}<span class="count">${items.length}개 패턴</span></div>
        ${items.map((g,i) => {
          const id = brand + '_' + i;
          const isOpen = !!openState[id];
          return `
          <div class="pattern-card ${isOpen ? 'open' : ''}" data-id="${id}">
            <div class="pattern-row" onclick="toggleCard('${id}')">
              <div class="pattern-main">
                <div class="pattern-name">${g.name}</div>
                <div class="pattern-spec">${g.spec} · 색상 ${g.models.length}종</div>
              </div>
              <div class="pattern-price">
                <div class="price-num">${g.firm_price.toLocaleString()}원</div>
                <div class="price-unit">/ BOX (부가세 별도)</div>
              </div>
              <div class="chev">▼</div>
            </div>
            <div class="model-panel" style="${isOpen ? 'max-height:400px;' : ''}">
              <div class="model-inner">
                ${g.models.map(m => `<span class="model-chip">${m}</span>`).join('')}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>`;
  }).join('');
}

function toggleCard(id){
  openState[id] = !openState[id];
  renderList();
}

loadData();
</script>
</body>
</html>
