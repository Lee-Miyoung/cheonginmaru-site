<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>청인마루 재고 관리</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink: #2B2622;
    --wood: #8B5E34;
    --wood-dark: #6E4A29;
    --paper: #F3F0EA;
    --paper-card: #FFFDF9;
    --line: #E3DCCE;
    --rust: #B3452B;
    --ochre: #C08A2E;
    --moss: #4B6B4F;
  }
  body { font-family:'Pretendard Variable','Noto Sans KR',sans-serif; background:var(--paper); color:var(--ink); -webkit-tap-highlight-color:transparent; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .premium-shadow { box-shadow: 0 1px 2px rgba(43,38,34,.05), 0 12px 28px -14px rgba(43,38,34,.18); }
  .input-premium { width:100%; padding:13px 14px; background:#FBF9F5; border:1px solid var(--line); border-radius:12px; font-weight:700; font-size:16px; color:#3A342C; outline:none; font-variant-numeric: tabular-nums; }
  .input-premium:focus { background:#fff; border-color:var(--wood); box-shadow:0 0 0 3px rgba(139,94,52,.12); }
  #login-gate { display:flex; position:fixed; inset:0; background:var(--ink); z-index:999; align-items:center; justify-content:center; }
  #toast { visibility:hidden; min-width:200px; background:#3A342C; color:#fff; text-align:center; border-radius:50px; padding:12px 24px; position:fixed; z-index:1000; left:50%; bottom:100px; transform:translateX(-50%); font-size:14px; font-weight:700; }
  #toast.show { visibility:visible; animation:fadein .3s, fadeout .3s 1.7s; }
  @keyframes fadein { from{opacity:0} to{opacity:1} }
  @keyframes fadeout { from{opacity:1} to{opacity:0} }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(30,26,20,.55); z-index:900; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .card { background:var(--paper-card); border:1px solid var(--line); border-radius:1.75rem; }
  .eyebrow { font-size:13px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; color:#7A7364; }
  input[type="date"] { font-size:13px; min-width:0; padding-left:8px !important; padding-right:4px !important; overflow:hidden; }
  .brand-dot { width:8px; height:8px; border-radius:50%; background:var(--wood); flex-shrink:0; }
  .brand-accordion-arrow { transition: transform .2s; }
  .brand-accordion-arrow.open { transform: rotate(180deg); }
</style>
</head>
<body class="antialiased">

<div id="toast">저장되었습니다</div>

<div id="login-gate">
  <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-sm text-center mx-4">
    <h2 class="text-xl font-black text-[#2B2622] mb-1">청인마루 재고 관리</h2>
    <p class="text-xs text-[#8B8477] font-bold mb-1">Stock System</p>
    <p id="fb-badge" class="text-[15px] font-bold text-[#B8B2A3] mb-6">연결 확인 중...</p>
    <input type="password" id="app-password" class="w-full p-4 bg-[#F3F0EA] rounded-xl text-center text-lg font-black outline-none focus:ring-2 ring-[#8B5E34] mb-4" placeholder="PASSWORD" onkeyup="if(event.keyCode==13) checkLogin()">
    <button onclick="checkLogin()" class="w-full py-4 bg-[#2B2622] text-white rounded-xl font-black text-lg">접속하기</button>
  </div>
</div>

<div id="log-modal" class="modal-overlay">
  <div class="card rounded-[1.5rem] w-full max-w-lg mx-4 h-[80vh] flex flex-col overflow-hidden">
    <div class="p-4 border-b flex justify-between items-center bg-[#FBF9F5]">
      <h3 class="font-black text-[#2B2622]"><i class="fas fa-history text-[#8B5E34] mr-1.5"></i>입출고 기록 <span id="fb-status-badge" class="text-[15px] px-2 py-0.5 rounded-full font-bold bg-emerald-100 text-[var(--moss)] ml-1">실시간 연결됨</span></h3>
      <button onclick="closeModal('log-modal')" class="w-8 h-8 rounded-full bg-[#E7E1D3] flex items-center justify-center"><i class="fas fa-times"></i></button>
    </div>
    <div class="p-3 border-b">
      <input type="text" id="log-search" class="input-premium text-sm" placeholder="브랜드/제품/모델 검색..." oninput="renderLog()">
    </div>
    <div class="px-3 pt-2 flex gap-2">
      <button id="log-tab-active" onclick="setLogTab('active')" class="flex-1 py-2 rounded-lg text-xs font-black bg-[#2B2622] text-white">전체 기록</button>
      <button id="log-tab-trash" onclick="setLogTab('trash')" class="flex-1 py-2 rounded-lg text-xs font-black bg-[#F3F0EA] text-[#B8B2A3]"><i class="fas fa-trash-can mr-1"></i>휴지통</button>
    </div>
    <div id="log-list" class="p-3 overflow-y-auto flex-1 space-y-2 bg-[#FAF8F4]"></div>
  </div>
</div>

<!-- 거래처 관리 모달 -->
<div id="vendor-modal" class="modal-overlay">
  <div class="card rounded-[1.5rem] w-full max-w-lg mx-4 h-[85vh] flex flex-col overflow-hidden">
    <div class="p-4 border-b flex justify-between items-center bg-[#FBF9F5]">
      <h3 class="font-black text-[#2B2622]"><i class="fas fa-address-book text-[#8B5E34] mr-1.5"></i>거래처 관리</h3>
      <button onclick="closeModal('vendor-modal')" class="w-8 h-8 rounded-full bg-[#E7E1D3] flex items-center justify-center"><i class="fas fa-times"></i></button>
    </div>

    <!-- 거래처 목록 화면 -->
    <div id="vendor-list-view" class="flex-1 flex flex-col overflow-hidden">
      <div class="p-3 border-b space-y-2">
        <input type="text" id="vendor-search" class="input-premium text-sm" placeholder="거래처명 검색..." oninput="renderVendorList()">
        <button onclick="showVendorForm()" class="w-full py-2.5 bg-[#8B5E34] text-white rounded-xl text-sm font-black"><i class="fas fa-plus mr-1"></i> 새 거래처 추가</button>
      </div>
      <div id="vendor-list" class="p-3 overflow-y-auto flex-1 space-y-2 bg-[#FAF8F4]"></div>
    </div>

    <!-- 새 거래처 입력 화면 -->
    <div id="vendor-form-view" class="hidden flex-1 flex flex-col overflow-hidden">
      <div class="p-4 overflow-y-auto flex-1 space-y-3">
        <button onclick="hideVendorForm()" class="text-xs font-bold text-[#B8B2A3]"><i class="fas fa-arrow-left mr-1"></i> 목록으로</button>
        <div><label class="text-[13px] font-black text-[#B8B2A3] pl-1">거래처명</label><input type="text" id="vf-name" class="input-premium mt-1" placeholder="예: OO인테리어"></div>
        <div><label class="text-[13px] font-black text-[#B8B2A3] pl-1">담당자/연락처</label><input type="text" id="vf-phone" class="input-premium mt-1" placeholder="이름 010-0000-0000"></div>
        <div><label class="text-[13px] font-black text-[#B8B2A3] pl-1">주소</label><input type="text" id="vf-addr" class="input-premium mt-1" placeholder="선택 입력"></div>
        <div><label class="text-[13px] font-black text-[#B8B2A3] pl-1">메모</label><input type="text" id="vf-memo" class="input-premium mt-1" placeholder="선택 입력"></div>
        <button onclick="saveVendor()" class="w-full py-3.5 bg-[#8B5E34] text-white rounded-xl text-sm font-black"><i class="fas fa-save mr-1"></i> 저장</button>
      </div>
    </div>

    <!-- 거래처 상세(타임라인) 화면 -->
    <div id="vendor-detail-view" class="hidden flex-1 flex flex-col overflow-hidden">
      <div class="p-4 border-b space-y-1">
        <button onclick="hideVendorDetail()" class="text-xs font-bold text-[#B8B2A3] mb-1"><i class="fas fa-arrow-left mr-1"></i> 목록으로</button>
        <h4 id="vd-name" class="text-lg font-black text-[#2B2622]">-</h4>
        <p id="vd-phone" class="text-[15px] text-[#8B8477] font-bold"></p>
        <p id="vd-addr" class="text-[15px] text-[#B8B2A3]"></p>
        <p id="vd-memo" class="text-[15px] text-[#B8B2A3] italic"></p>
      </div>
      <div class="p-3 border-b bg-[#FBF9F5] space-y-2">
        <div class="grid grid-cols-2 gap-2">
          <select id="vl-type" class="input-premium text-sm">
            <option value="샘플북 전달">샘플북 전달</option>
            <option value="방문">방문</option>
            <option value="전화 통화">전화 통화</option>
            <option value="기타">기타</option>
          </select>
          <input type="date" id="vl-date" class="input-premium text-sm">
        </div>
        <input type="text" id="vl-note" class="input-premium text-sm" placeholder="메모 (예: 노바마루 신제품 샘플북 전달)">
        <button onclick="addVendorLog()" class="w-full py-2.5 bg-[#2B2622] text-white rounded-xl text-sm font-black"><i class="fas fa-plus mr-1"></i> 기록 추가</button>
      </div>
      <div id="vendor-timeline" class="p-3 overflow-y-auto flex-1 space-y-2 bg-white"></div>
    <div class="p-2 border-t bg-[#FBF9F5]">
      <button onclick="toggleVendorLogTrash()" id="vendor-trash-toggle-btn" class="w-full py-2 text-xs font-black text-[#B8B2A3]"><i class="fas fa-trash-can mr-1"></i>삭제된 기록 보기 (복구 가능)</button>
    </div>
    </div>
  </div>
</div>

<!-- 월별 매입 통계 모달 -->
<div id="monthly-modal" class="modal-overlay">
  <div class="card rounded-[1.5rem] w-full max-w-lg mx-4 h-[85vh] flex flex-col overflow-hidden">
    <div class="p-4 border-b flex justify-between items-center bg-[#FBF9F5]">
      <h3 class="font-black text-[#2B2622]"><i class="fas fa-chart-column text-[#8B5E34] mr-1.5"></i>월별 매입 통계</h3>
      <button onclick="closeModal('monthly-modal')" class="w-8 h-8 rounded-full bg-[#E7E1D3] flex items-center justify-center"><i class="fas fa-times"></i></button>
    </div>
    <div class="p-3 border-b flex items-center justify-between gap-2">
      <button onclick="shiftMonth(-1)" class="w-9 h-9 rounded-lg bg-[#F3F0EA] text-[#8B5E34] flex items-center justify-center"><i class="fas fa-chevron-left"></i></button>
      <span id="monthly-current-label" class="text-base font-black text-[#2B2622]">-</span>
      <button onclick="shiftMonth(1)" class="w-9 h-9 rounded-lg bg-[#F3F0EA] text-[#8B5E34] flex items-center justify-center"><i class="fas fa-chevron-right"></i></button>
    </div>
    <div class="p-4 overflow-y-auto flex-1 space-y-3">
      <div class="rounded-2xl bg-[#2B2622] text-white p-4">
        <p class="eyebrow text-[#C9A57C]">이 달 총 매입액 (VAT별도)</p>
        <p id="monthly-total-amount" class="text-2xl font-black mt-1 num">0원</p>
        <p id="monthly-total-qty" class="text-[14px] text-[#B8B2A3] font-bold mt-1">0 BOX · 0건</p>
      </div>
      <div>
        <p class="eyebrow mb-2">브랜드별 매입액</p>
        <div id="monthly-brand-list" class="space-y-1.5"></div>
      </div>
    </div>
  </div>
</div>

<div class="max-w-2xl mx-auto p-4 md:p-6">

  <header class="card premium-shadow px-4 py-3 flex items-center justify-between mb-5">
    <div>
      <h1 class="text-lg font-black text-[#2B2622]">청인마루<span class="text-[#8B5E34]">.</span> 재고관리</h1>
      <p class="text-[13px] text-[#8B8477] font-bold">Stock System · 실시간 공유 <span id="debug-count" class="text-[#A9784F]"></span></p>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="exportBackup()" class="w-9 h-9 rounded-lg bg-[#F3F0EA] text-[#8B8477] hover:text-[var(--moss)] flex items-center justify-center" title="전체 데이터 백업"><i class="fas fa-download"></i></button>
      <button onclick="loadMasterCSV(true)" class="w-9 h-9 rounded-lg bg-[#F3F0EA] text-[#8B8477] hover:text-[#8B5E34] flex items-center justify-center" title="품목목록 새로고침"><i class="fas fa-sync-alt"></i></button>
      <button onclick="openMonthlyModal()" class="w-9 h-9 rounded-lg bg-[#F3F0EA] text-[#8B8477] hover:text-[#8B5E34] flex items-center justify-center" title="월별 매입 통계"><i class="fas fa-chart-column"></i></button>
      <button onclick="openVendorModal()" class="w-9 h-9 rounded-lg bg-[#F3F0EA] text-[#8B8477] hover:text-[#8B5E34] flex items-center justify-center" title="거래처 관리"><i class="fas fa-address-book"></i></button>
      <button onclick="openLogModal()" class="w-9 h-9 rounded-lg bg-[#F3F0EA] text-[#8B8477] hover:text-[#8B5E34] flex items-center justify-center" title="입출고 기록"><i class="fas fa-list-ul"></i></button>
    </div>
  </header>

  <div class="card p-5 premium-shadow space-y-4 mb-5">
    <div class="grid grid-cols-3 bg-[#2B2622] p-1 rounded-2xl gap-1">
      <button id="type-in" class="py-3 rounded-xl text-[13px] font-black text-white bg-[#8B5E34]" onclick="setType('입고')"><i class="fas fa-arrow-down mr-1"></i>입고</button>
      <button id="type-out" class="py-3 rounded-xl text-[13px] font-black text-[#B8B2A3]" onclick="setType('출고')"><i class="fas fa-arrow-up mr-1"></i>출고</button>
      <button id="type-return" class="py-3 rounded-xl text-[13px] font-black text-[#B8B2A3]" onclick="setType('반품')"><i class="fas fa-rotate-left mr-1"></i>반품</button>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <select id="sel-brand" class="input-premium" onchange="updateProducts()"></select>
      <select id="sel-product" class="input-premium" onchange="updateModels()"></select>
    </div>
    <select id="sel-model" class="input-premium" onchange="onModelChange(); autoFillCostPrice();"></select>

    <div class="date-row grid grid-cols-2 gap-2.5">
      <div><label class="eyebrow pl-1">로트번호</label><input type="text" id="in-lot" class="input-premium mt-1" placeholder="예: L20260819-01" oninput="onModelChange()"></div>
      <div><label class="eyebrow pl-1">생산일자</label><div class="relative mt-1"><div class="input-premium flex items-center justify-between pointer-events-none"><span id="in-prod-date-text" class="num text-[16px]">날짜 선택</span><i class="fas fa-calendar-day text-[#B8B2A3]"></i></div><input type="date" id="in-prod-date" class="absolute inset-0 w-full h-full opacity-0 z-10" oninput="syncDateDisplay('in-prod-date')"></div></div>
    </div>

    <div id="current-stock-box" class="hidden bg-[#F1F5F1] border border-[#D9E4D9] rounded-xl px-4 py-2.5 flex justify-between items-center">
      <span class="text-[14px] font-black text-[var(--moss)]"><i class="fas fa-warehouse mr-1"></i><span id="current-stock-label">현재 재고</span></span>
      <span id="current-stock-val" class="text-sm font-black text-[var(--moss)] num">-</span>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <div><label class="eyebrow pl-1">수량 (박스)</label><input type="number" id="in-qty" class="input-premium mt-1 num" placeholder="0"></div>
      <div><label class="eyebrow pl-1">거래처</label><input type="text" id="in-vendor" class="input-premium mt-1" placeholder="동화자연마루 등"></div>
    </div>
    <div id="price-field" class="grid grid-cols-2 gap-2.5">
      <div><label class="eyebrow pl-1">매입단가(VAT별도) <span class="text-[#A9784F] normal-case font-medium tracking-normal">· 원가자동</span></label><input type="text" id="in-price" class="input-premium mt-1 num" placeholder="0" oninput="formatMoney(this); syncPriceFromExVat();"></div>
      <div><label class="eyebrow pl-1">매입단가(VAT포함)</label><input type="text" id="in-price-vat" class="input-premium mt-1 num" placeholder="0" oninput="formatMoney(this); syncPriceFromIncVat();"></div>
    </div>
    <div class="date-row grid grid-cols-2 gap-2.5">
      <div><label class="eyebrow pl-1">발주일자</label><div class="relative mt-1"><div class="input-premium flex items-center justify-between pointer-events-none"><span id="in-order-date-text" class="num text-[16px]">날짜 선택</span><i class="fas fa-calendar-day text-[#B8B2A3]"></i></div><input type="date" id="in-order-date" class="absolute inset-0 w-full h-full opacity-0 z-10" oninput="syncDateDisplay('in-order-date')"></div></div>
      <div><label class="eyebrow pl-1">입고일자</label><div class="relative mt-1"><div class="input-premium flex items-center justify-between pointer-events-none"><span id="in-date-text" class="num text-[16px]">날짜 선택</span><i class="fas fa-calendar-day text-[#B8B2A3]"></i></div><input type="date" id="in-date" class="absolute inset-0 w-full h-full opacity-0 z-10" oninput="syncDateDisplay('in-date')"></div></div>
    </div>
    <div><label class="eyebrow pl-1">메모 <span id="memo-hint" class="text-[#B8B2A3] normal-case font-medium tracking-normal"></span></label><input type="text" id="in-memo" class="input-premium mt-1" placeholder="선택 입력 (반품 사유 등)"></div>

    <button onclick="submitMovement()" class="w-full py-4 bg-[#8B5E34] text-white rounded-2xl font-black text-base shadow-lg shadow-[#EFE2CF] active:scale-95 transition-transform">
      <i class="fas fa-save mr-1.5"></i> 저장 (모든 기기에 즉시 반영)
    </button>
    <div id="save-status" class="text-center text-xs font-bold py-1"></div>
  </div>

  <div class="card p-5 premium-shadow">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-sm font-black text-[#3A342C]"><i class="fas fa-boxes-stacked text-[#8B5E34] mr-1.5"></i>재고 현황 <span class="eyebrow font-bold normal-case ml-1">브랜드별</span></h3>
      <span id="stock-count" class="text-[13px] font-bold text-[#8B8477]"></span>
    </div>
    <input type="text" id="stock-search" class="input-premium text-sm mb-3" placeholder="브랜드/제품/모델 검색..." oninput="renderStockList()">
    <div id="stock-list" class="space-y-2 max-h-[65vh] overflow-y-auto"></div>
  </div>

</div>

<script>
  // ===== 1) 900개 품목 조회 - 마루견적서(index.html)가 이미 쓰고 있는 공개 링크를 그대로 재사용 =====
  //     읽기 전용 GET 요청이라 견적서/파트너가격 쪽에는 전혀 영향 없음. 새로 만들 것도, 공개 설정할 것도 없음.
  const MASTER_SHEET_URL = "https://script.google.com/macros/s/AKfycbxHU1h6Vu2W5Yovgm8yRJKIoALUdpeLQULRdCKdVMtnER2QewMbFBAn0Q1s30hvtFpP/exec";
  // 매입단가(비밀 단가) 조회용 - 견적서(index.html)의 ADMIN_KEY와 동일해야 시트의 원가 컬럼이 열림
  const ADMIN_KEY = "cm_wondeok_7d3f9k";

  // ===== 2) Firebase - 견적서(index.html)와 동일한 프로젝트를 그대로 재사용 =====
  //     stock_movements 라는 새 저장공간만 씀. quote_history(견적기록)는 전혀 건드리지 않음.
  const firebaseConfig = {
    apiKey: "AIzaSyCHdMgp2clJ0y3L1GR-WubpAYKEVYvLcLA",
    authDomain: "maru-quote-history.firebaseapp.com",
    databaseURL: "https://maru-quote-history-default-rtdb.firebaseio.com",
    projectId: "maru-quote-history",
    storageBucket: "maru-quote-history.firebasestorage.app",
    messagingSenderId: "936179721364",
    appId: "1:936179721364:web:cbf9e9bb6c71970d400081"
  };
  let fbDatabase = null;

  firebase.initializeApp(firebaseConfig);
  fbDatabase = firebase.database();
  let authReady = false;
  firebase.auth().signInAnonymously()
    .then(() => { authReady = true; document.getElementById('fb-badge').innerText = '🟢 실시간 연결됨 (전체 기기 공유)'; })
    .catch(err => {
      console.error('Firebase 인증 실패', err);
      document.getElementById('fb-badge').innerText = '🔴 연결 실패: ' + (err && err.code ? err.code : err);
      showToast('⚠️ 로그인 연결 실패: ' + (err && err.code ? err.code : err), true);
    });

  let masterData = {}; // { brand: { product: [model,...] } }
  let costDataMap = {}; // { "brand||name||model": {ex, inc} } - 매입단가(비밀 단가), VAT별도/포함
  let movements = {};  // { fbKey: {날짜,구분,brand,name,model,수량,단가,거래처,메모} }
  let stockSummary = [];
  let currentType = '입고';

  function syncDateDisplay(id) {
    const val = document.getElementById(id).value; // yyyy-mm-dd
    const textEl = document.getElementById(id + '-text');
    if (!textEl) return;
    if (!val) { textEl.innerText = '날짜 선택'; textEl.classList.add('text-[#B8B2A3]'); return; }
    const [y, m, d] = val.split('-');
    textEl.innerText = `${y}.${parseInt(m)}.${parseInt(d)}`;
    textEl.classList.remove('text-[#B8B2A3]');

  window.onload = function() {
    document.getElementById('in-date').value = new Date().toISOString().slice(0,10);
    document.getElementById('in-order-date').value = new Date().toISOString().slice(0,10);
    syncDateDisplay('in-date');
    syncDateDisplay('in-order-date');
    syncDateDisplay('in-prod-date');

      document.getElementById('login-gate').style.display = 'none';
      init();
    }
  };

  function checkLogin() {
    if (btoa(document.getElementById('app-password').value) === 'MTMwNg==') { // 1306
      localStorage.setItem('cm_stock_auth', 'valid');
      document.getElementById('login-gate').style.display = 'none';

  function init() {
    loadMasterCSV(false);
    loadCostData();
    setType('입고');
    checkBackupReminder();
    // Firebase 전용 진단 경로: 이 기기가 실제로 서버와 연결돼 있는지 실시간 표시
    fbDatabase.ref('.info/connected').on('value', snap => {
      const dbg = document.getElementById('debug-count');

    fbDatabase.ref('stock_movements').on('value', snap => {
      movements = snap.val() || {};
      recalcStockSummary();
      renderStockList();

      if (dbg) dbg.innerText = '(읽기 실패: ' + err.code + ')';
    });

  // ===== ① 정기 백업 =====
  function checkBackupReminder() {
    const last = parseInt(localStorage.getItem('cm_stock_last_backup') || '0');
    const days = (Date.now() - last) / (1000*60*60*24);
    if (!last || days > 14) {
      setTimeout(() => showToast('⚠️ 백업한 지 오래됐어요. 상단 다운로드 버튼으로 백업해주세요'), 1200);
    }
  }

  async function exportBackup() {
    showToast('백업 파일 생성 중...');
    try {
      const [mv, mvTrash, vd, vdTrash, vl, vlTrash] = await Promise.all([
        fbDatabase.ref('stock_movements').once('value'),
        fbDatabase.ref('stock_movements_trash').once('value'),
        fbDatabase.ref('vendors').once('value'),
        fbDatabase.ref('vendors_trash').once('value'),
        fbDatabase.ref('vendor_logs').once('value'),
        fbDatabase.ref('vendor_logs_trash').once('value')
      ]);
      const backup = {
        backupDate: new Date().toISOString(),
        stock_movements: mv.val() || {},
        stock_movements_trash: mvTrash.val() || {},
        vendors: vd.val() || {},
        vendors_trash: vdTrash.val() || {},
        vendor_logs: vl.val() || {},
        vendor_logs_trash: vlTrash.val() || {}
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `청인마루_재고백업_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      localStorage.setItem('cm_stock_last_backup', String(Date.now()));
      showToast('백업 완료! 다운로드 폴더를 확인하세요');
    } catch(e) { showToast('백업 실패'); }
  }

  // ===== 매입단가(비밀 단가) 불러오기 - 견적서 관리패널과 같은 데이터, 로그인(1306)한 직원은 바로 조회됨 =====
  async function loadCostData() {
    try {
      const res = await fetch(`${MASTER_SHEET_URL}?k=${encodeURIComponent(ADMIN_KEY)}`);
      let jsonData = await res.json();
      jsonData = fillMergedCells(jsonData);
      costDataMap = {};
      jsonData.forEach(item => {
        const brand = String(item.brand || '').trim();
        const name = String(item.name || '').trim();
        const model = String(item.model || '').trim();
        const exVatKey = Object.keys(item).find(k => k.replace(/\s/g,'') === '원가(vat미포함)' || k.replace(/\s/g,'') === '원가(vat별도)');
        const incVatKey = Object.keys(item).find(k => k.replace(/\s/g,'') === '원가(vat포함)');
        const costEx = parseInt(String(item.cost ?? item.cost_ex_vat ?? item['원가'] ?? (exVatKey ? item[exVatKey] : '') ?? '').replace(/,/g,'')) || 0;
        const costInc = parseInt(String(item.cost_inc_vat ?? item.cost_vat ?? (incVatKey ? item[incVatKey] : '') ?? '').replace(/,/g,'')) || 0;
        if (!brand || !name) return;
        const key = `${brand}||${name}||${model}`;
        if (costEx || costInc) costDataMap[key] = { ex: costEx, inc: costInc };
      });
    } catch(e) { /* 원가 조회 실패해도 재고 입력 자체는 계속 가능하게 조용히 무시 */ }
  }

  function getCostPriceFor(brand, name, model) {
    return costDataMap[`${brand}||${name}||${model}`] || costDataMap[`${brand}||${name}||`] || null;
  }

  // ===== VAT별도 <-> VAT포함 상호 자동계산 (한쪽 수정하면 다른쪽도 즉시 갱신) =====
  function syncPriceFromExVat() {
    const ex = parseInt((document.getElementById('in-price').value||'0').replace(/,/g,'')) || 0;
    document.getElementById('in-price-vat').value = ex ? Math.round(ex * 1.1).toLocaleString() : '';
  }
  function syncPriceFromIncVat() {
    const inc = parseInt((document.getElementById('in-price-vat').value||'0').replace(/,/g,'')) || 0;
    document.getElementById('in-price').value = inc ? Math.round(inc / 1.1).toLocaleString() : '';
  }

  function showToast(msg, long) { const t=document.getElementById('toast'); t.innerText=msg; t.className='show'; setTimeout(()=>t.className='', long ? 5000 : 2000); }
  function closeModal(id){ document.getElementById(id).style.display='none'; }
  function formatMoney(el){ let v=el.value.replace(/[^0-9]/g,''); el.value = v? parseInt(v).toLocaleString():''; }

  function setType(t) {
    currentType = t;
    const styles = {
      '입고': ['text-white bg-[#8B5E34]','text-[#B8B2A3]','text-[#B8B2A3]'],
      '출고': ['text-[#B8B2A3]','text-white bg-rose-500','text-[#B8B2A3]'],
      '반품': ['text-[#B8B2A3]','text-[#B8B2A3]','text-white bg-amber-500']
    };
    const s = styles[t];
    document.getElementById('type-in').className = 'py-3 rounded-xl text-[13px] font-black transition-all ' + s[0];
    document.getElementById('type-out').className = 'py-3 rounded-xl text-[13px] font-black transition-all ' + s[1];
    document.getElementById('type-return').className = 'py-3 rounded-xl text-[13px] font-black transition-all ' + s[2];
    document.getElementById('price-field').classList.toggle('opacity-30', t!=='입고');
    document.getElementById('price-field').classList.toggle('pointer-events-none', t!=='입고');
    document.getElementById('memo-hint').innerText = t==='반품' ? '(반품 사유 꼭 적어주세요)' : '';
  }

  // ===== 900개 품목 읽기 (읽기 전용 GET, 구글시트 원본/견적서에 아무 영향 없음) =====
  // 마루견적서와 동일한 병합셀 처리(fillMergedCells) 로직을 그대로 적용해 brand/name이 빈 칸인 행도 정상 인식
  function fillMergedCells(jsonData) {
    const lastValues = {};
    return jsonData.map(row => {
      const hasAnyValue = Object.values(row).some(v => v !== undefined && v !== null && String(v).trim() !== '');
      if (!hasAnyValue) return row;
      const filled = { ...row };
      ['brand', 'name'].forEach(key => {
        const val = filled[key];
        const isEmpty = val === undefined || val === null || String(val).trim() === '';
        if (isEmpty) { if (lastValues[key] !== undefined) filled[key] = lastValues[key]; }
        else { lastValues[key] = val; }
      });
      return filled;
    });
  }

  async function loadMasterCSV(showMsg) {
    try {
      const res = await fetch(MASTER_SHEET_URL);
      let jsonData = await res.json();
      jsonData = fillMergedCells(jsonData);
      masterData = {};
      jsonData.forEach(item => {
        const brand = String(item.brand || '').trim();
        const name = String(item.name || '').trim();
        const model = String(item.model || '').trim();
        const category = String(item.category ?? item['구분'] ?? '바닥재').trim();
        // 철거단가표 행, 벽장재 행은 재고 대상에서 제외 (마루 위주로 관리)
        if (category.includes('철거') || category.includes('벽')) return;
        if (!brand || !name || !model) return;
        if (!masterData[brand]) masterData[brand] = {};
        if (!masterData[brand][name]) masterData[brand][name] = [];
        if (!masterData[brand][name].includes(model)) masterData[brand][name].push(model);
      });
      renderBrandSelect();
      if (showMsg) showToast('품목 목록 업데이트 완료');
    } catch(e) { showToast('품목 목록 불러오기 실패'); }
  }

  function renderBrandSelect() {
    const sel = document.getElementById('sel-brand');
    const prev = sel.value;
    sel.innerHTML = '<option value="">브랜드 선택</option>';
    Object.keys(masterData).sort().forEach(b => sel.add(new Option(b,b)));
    if (prev && masterData[prev]) sel.value = prev;
    updateProducts();
  }

  function updateProducts() {
    const b = document.getElementById('sel-brand').value;
    const sel = document.getElementById('sel-product');
    sel.innerHTML = '<option value="">제품 선택</option>';
    if (b && masterData[b]) Object.keys(masterData[b]).forEach(n => sel.add(new Option(n,n)));
    updateModels();
  }

  function updateModels() {
    const b = document.getElementById('sel-brand').value;
    const p = document.getElementById('sel-product').value;
    const sel = document.getElementById('sel-model');
    sel.innerHTML = '<option value="">색상/모델 선택</option>';
    if (b && p && masterData[b] && masterData[b][p]) masterData[b][p].forEach(m => sel.add(new Option(m,m)));
    onModelChange();
    autoFillCostPrice();
  }

  function autoFillCostPrice() {
    if (currentType !== '입고') return;
    const b = document.getElementById('sel-brand').value;
    const p = document.getElementById('sel-product').value;
    const m = document.getElementById('sel-model').value;
    if (!b || !p) return;
    const cost = getCostPriceFor(b, p, m);
    if (!cost) return;
    const ex = cost.ex || (cost.inc ? Math.round(cost.inc / 1.1) : 0);
    const inc = cost.inc || (cost.ex ? Math.round(cost.ex * 1.1) : 0);
    document.getElementById('in-price').value = ex ? ex.toLocaleString() : '';
    document.getElementById('in-price-vat').value = inc ? inc.toLocaleString() : '';
  }

  function onModelChange() {
    const b = document.getElementById('sel-brand').value;
    const p = document.getElementById('sel-product').value;
    const m = document.getElementById('sel-model').value;
    const lot = (document.getElementById('in-lot').value || '').trim();
    const box = document.getElementById('current-stock-box');
    if (!b || !p || !m) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    if (lot) {
      const found = stockSummary.find(s => s.brand===b && s.name===p && s.model===m && s.lot===lot);
      const stock = found ? found.stock : 0;
      document.getElementById('current-stock-label').innerText = `현재 재고 (로트: ${lot})`;
      document.getElementById('current-stock-val').innerText = stock.toLocaleString() + ' BOX';
      document.getElementById('current-stock-val').className = 'text-sm font-black ' + (stock <= 0 ? 'text-rose-500' : 'text-[var(--moss)]');
    } else {
      const total = stockSummary.filter(s => s.brand===b && s.name===p && s.model===m).reduce((a,s)=>a+s.stock,0);
      document.getElementById('current-stock-label').innerText = '현재 재고 (전체 로트 합계)';
      document.getElementById('current-stock-val').innerText = total.toLocaleString() + ' BOX';
      document.getElementById('current-stock-val').className = 'text-sm font-black ' + (total <= 0 ? 'text-rose-500' : 'text-[var(--moss)]');
    }
  }

  // ===== Firebase 실시간 데이터를 기반으로 brand+name+model+로트번호별 현재재고 재계산 =====
  function recalcStockSummary() {
    const map = {};
    Object.values(movements).forEach(r => {
      if (!r.brand || !r.name || !r.model) return;
      const lot = r.lot || '';
      const key = `${r.brand}||${r.name}||${r.model}||${lot}`;
      if (!map[key]) map[key] = { brand:r.brand, name:r.name, model:r.model, lot, prodDate:r.prodDate||'', stock:0 };
      const qty = Number(r.qty) || 0;
      if (r.type === '입고') map[key].stock += qty;
      else if (r.type === '출고' || r.type === '반품') map[key].stock -= qty;
      if (r.type === '입고' && r.prodDate) map[key].prodDate = r.prodDate; // 최근 입고 기준 생산일자 표시
    });
    stockSummary = Object.values(map).sort((a,b) => a.stock - b.stock);
  }

  let expandedBrands = new Set();
  function toggleBrandGroup(brand) {
    if (expandedBrands.has(brand)) expandedBrands.delete(brand); else expandedBrands.add(brand);
    renderStockList();
  }

  // 브랜드별 고유 색상 (가독성을 위해 늘 같은 브랜드는 항상 같은 색)
  const BRAND_COLORS = ['#8B5E34','#4B6B4F','#B3452B','#5C7A99','#7D5A8C','#C08A2E','#3E7C7C','#9C5B5B','#5E7A3E','#8C4B6B'];
  function getBrandColor(brand) {
    let h = 0;
    for (let i = 0; i < brand.length; i++) h = (h * 31 + brand.charCodeAt(i)) >>> 0;
    return BRAND_COLORS[h % BRAND_COLORS.length];
  }

  function renderStockList() {
    const q = (document.getElementById('stock-search').value || '').toLowerCase();
    const box = document.getElementById('stock-list');
    const filtered = stockSummary.filter(s => !q || (s.brand+s.name+s.model).toLowerCase().includes(q));
    document.getElementById('stock-count').innerText = `${filtered.length}개 품목`;
    box.innerHTML = '';
    if (!filtered.length) { box.innerHTML = '<div class="text-center py-8 text-[#B8B2A3] text-base">기록이 없습니다</div>'; return; }

    // 브랜드별로 그룹핑
    const groups = {};
    filtered.forEach(s => { (groups[s.brand] = groups[s.brand] || []).push(s); });
    const brandNames = Object.keys(groups).sort((a,b) => a.localeCompare(b, 'ko'));

    // 검색 중일 때는 자동으로 다 펼쳐서 보여줌
    const autoExpand = !!q;

    brandNames.forEach(brand => {
      const items = groups[brand].sort((a,b) => (a.name+a.model).localeCompare(b.name+b.model, 'ko'));
      const totalBox = items.reduce((sum, s) => sum + s.stock, 0);
      const lowCount = items.filter(s => s.stock <= 0).length;
      const isOpen = autoExpand || expandedBrands.has(brand);
      const color = getBrandColor(brand);

      const groupWrap = document.createElement('div');
      groupWrap.className = 'rounded-2xl border border-[var(--line)] overflow-hidden';
      groupWrap.style.borderLeft = `5px solid ${color}`;

      const header = document.createElement('button');
      header.type = 'button';
      header.className = 'w-full flex items-center justify-between px-3.5 py-3.5 bg-[#FBF9F5]';
      header.onclick = () => toggleBrandGroup(brand);
      header.innerHTML = `
        <span class="flex items-center gap-2 min-w-0">
          <span class="brand-dot" style="background:${color}"></span>
          <span class="text-[17px] font-black truncate" style="color:${color}">${brand}</span>
          <span class="text-[13px] font-bold text-[#B8B2A3] shrink-0">${items.length}개${lowCount ? ' · 부족 ' + lowCount : ''}</span>
        </span>
        <span class="flex items-center gap-2 shrink-0">
          <span class="text-base font-black text-[#3A342C] num">${totalBox.toLocaleString()} <span class="text-[13px] font-bold text-[#8B8477]">BOX</span></span>
          <i class="fas fa-chevron-down text-[13px] text-[#B8B2A3] brand-accordion-arrow${isOpen ? ' open' : ''}"></i>
        </span>
      `;
      groupWrap.appendChild(header);

      const body = document.createElement('div');
      body.className = isOpen ? 'divide-y divide-[var(--line)]' : 'hidden';
      items.forEach(s => {
        const low = s.stock <= 0;
        const row = document.createElement('div');
        row.className = 'flex justify-between items-center gap-2 px-3.5 py-3 bg-white ' + (low ? 'bg-[#FBF1EE]' : '');
        row.innerHTML = `
          <div class="min-w-0 flex-1">
            <p class="text-[13px] font-bold text-[#B8B2A3] truncate">${s.name}</p>
            <p class="text-[15px] font-black text-[#3A342C] truncate">${s.model}</p>
            <p class="text-[13px] text-[#B8B2A3] font-bold mt-0.5">${s.lot ? ('로트 '+s.lot) : '로트 미기재'}${s.prodDate ? (' · '+s.prodDate) : ''}</p>
          </div>
          <span class="text-[17px] font-black ${low ? 'text-[var(--rust)]' : 'text-[#3A342C]'} shrink-0 num">${s.stock.toLocaleString()} <span class="text-[13px] font-bold text-[#B8B2A3]">BOX</span></span>
        `;
        body.appendChild(row);
      });
      groupWrap.appendChild(body);
      box.appendChild(groupWrap);
    });
  }

  function setSaveStatus(msg, ok) {
    const el = document.getElementById('save-status');
    if (!el) return;
    el.innerText = msg;
    el.className = 'text-center text-xs font-bold py-1 ' + (ok ? 'text-[var(--moss)]' : 'text-rose-500');
  }

  function submitMovement() {
    const brand = document.getElementById('sel-brand').value;
    const name = document.getElementById('sel-product').value;
    const model = document.getElementById('sel-model').value;
    const qty = parseFloat(document.getElementById('in-qty').value) || 0;
    if (!brand || !name || !model) { showToast('브랜드/제품/모델을 선택하세요'); setSaveStatus('❌ 브랜드/제품/모델을 선택하세요', false); return; }
    if (qty <= 0) { showToast('수량을 입력하세요'); setSaveStatus('❌ 수량을 입력하세요', false); return; }
    if (currentType === '반품' && !document.getElementById('in-memo').value.trim()) { showToast('반품 사유를 메모에 적어주세요'); setSaveStatus('❌ 반품 사유를 메모에 적어주세요', false); return; }
    if (!authReady) { showToast('⚠️ 아직 서버 연결 중입니다. 5초 후 다시 눌러주세요', true); setSaveStatus('⏳ 서버 연결 중... 5초 후 다시 눌러주세요', false); return; }

    setSaveStatus('저장 중...', true);

    const record = {
      date: document.getElementById('in-date').value,
      orderDate: document.getElementById('in-order-date').value,
      type: currentType,
      brand, name, model,
      lot: document.getElementById('in-lot').value.trim(),
      prodDate: document.getElementById('in-prod-date').value,
      qty,
      price: parseInt((document.getElementById('in-price').value||'0').replace(/,/g,'')) || 0,
      priceIncVat: parseInt((document.getElementById('in-price-vat').value||'0').replace(/,/g,'')) || 0,
      vendor: document.getElementById('in-vendor').value,
      memo: document.getElementById('in-memo').value,
      ts: Date.now()
    };

    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject({ code: 'timeout', message: '서버 응답 없음 (8초 초과) - 와이파이/네트워크를 확인하거나 데이터(LTE)로 시도해보세요' }), 8000));

    Promise.race([fbDatabase.ref('stock_movements').push(record), timeoutPromise]).then(() => {
      showToast(currentType + ' 저장 완료 (전체 기기 즉시 반영)', true);
      setSaveStatus('✅ ' + new Date().toLocaleTimeString() + ' 저장 완료', true);
      document.getElementById('in-qty').value = '';
      document.getElementById('in-price').value = '';
      document.getElementById('in-price-vat').value = '';
      document.getElementById('in-vendor').value = '';
      document.getElementById('in-memo').value = '';
      document.getElementById('in-lot').value = '';
      document.getElementById('in-prod-date').value = '';
      syncDateDisplay('in-prod-date');
    }).catch((err) => {
      const msg = '저장 실패: ' + (err && err.message ? err.message : err);
      showToast(msg, true);
      setSaveStatus('❌ ' + msg, false);
    });
  }

  function openLogModal() {
    document.getElementById('log-modal').style.display = 'flex';
    setLogTab('active');
  }

  let logTab = 'active';
  let movementsTrash = {};
  function setLogTab(tab) {
    logTab = tab;
    document.getElementById('log-tab-active').className = 'flex-1 py-2 rounded-lg text-xs font-black ' + (tab==='active' ? 'bg-[#2B2622] text-white' : 'bg-[#F3F0EA] text-[#B8B2A3]');
    document.getElementById('log-tab-trash').className = 'flex-1 py-2 rounded-lg text-xs font-black ' + (tab==='trash' ? 'bg-rose-500 text-white' : 'bg-[#F3F0EA] text-[#B8B2A3]') + ' flex items-center justify-center';
    if (tab === 'trash') {
      fbDatabase.ref('stock_movements_trash').once('value').then(snap => { movementsTrash = snap.val() || {}; renderLog(); });
    } else { renderLog(); }
  }

  function renderLog() {
    const q = (document.getElementById('log-search').value || '').toLowerCase();
    const box = document.getElementById('log-list');
    const source = logTab === 'trash' ? movementsTrash : movements;
    const list = Object.keys(source).map(key => ({ key, ...source[key] }))
      .sort((a,b) => (b.ts||0) - (a.ts||0))
      .filter(r => !q || (r.brand+r.name+r.model).toLowerCase().includes(q));
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = `<div class="text-center py-8 text-[#B8B2A3] text-sm">${logTab==='trash'?'휴지통이 비어있습니다':'기록이 없습니다'}</div>`; return; }
    list.forEach(r => {
      const badgeStyle = r.type==='입고' ? 'bg-[#EFE2CF] text-[#8B5E34]' : r.type==='반품' ? 'bg-amber-100 text-amber-600' : 'bg-rose-100 text-rose-600';
      const row = document.createElement('div');
      row.className = 'bg-white border border-[var(--line)] rounded-xl p-3 flex justify-between items-center';
      row.innerHTML = `
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5 mb-0.5">
            <span class="text-[15px] font-black px-1.5 py-0.5 rounded-full ${badgeStyle}">${r.type}</span>
            <span class="text-[13px] text-[#B8B2A3] font-bold">입고 ${r.date||''}${r.orderDate?(' · 발주 '+r.orderDate):''}</span>
          </div>
          <p class="text-sm font-black text-[#3A342C] truncate">${r.brand} · ${r.name} · ${r.model}</p>
          <p class="text-[14px] text-[#B8B2A3] font-bold">${r.qty}BOX ${r.price?('· '+Number(r.price).toLocaleString()+'원(VAT별도)'):''}${r.priceIncVat?(' / '+Number(r.priceIncVat).toLocaleString()+'원(VAT포함)'):''} ${r.vendor?('· '+r.vendor):''}</p>
          <p class="text-[13px] text-[#CFC9BB] font-bold">${r.lot?('로트: '+r.lot):''} ${r.prodDate?('· 생산일 '+r.prodDate):''} ${r.memo?('· '+r.memo):''}</p>
        </div>
        ${ logTab === 'trash'
          ? `<div class="flex flex-col gap-1 shrink-0"><button onclick="restoreLog('${r.key}')" class="text-emerald-500 hover:text-[var(--moss)] text-xs px-2 py-1 bg-[#F1F5F1] rounded-lg font-bold"><i class="fas fa-rotate-left mr-1"></i>복구</button><button onclick="permanentDeleteLog('${r.key}')" class="text-[#B8B2A3] hover:text-rose-500 text-[13px] px-2">완전삭제</button></div>`
          : `<button onclick="deleteLog('${r.key}')" class="text-[#CFC9BB] hover:text-rose-500 px-2 shrink-0"><i class="fas fa-trash"></i></button>`
        }
      `;
      box.appendChild(row);
    });
  }

  // 삭제 = 휴지통으로 이동 (완전 삭제 아님, 복구 가능)
  function deleteLog(key) {
    if (!confirm('이 기록을 휴지통으로 이동할까요?\\n(휴지통에서 언제든 복구할 수 있습니다)')) return;
    const record = movements[key];
    if (!record) return;
    fbDatabase.ref('stock_movements_trash/' + key).set({ ...record, deletedAt: Date.now() })
      .then(() => fbDatabase.ref('stock_movements/' + key).remove())
      .then(() => showToast('휴지통으로 이동했습니다'))
      .catch((err) => showToast('삭제 실패: ' + (err && err.message ? err.message : err), true));
  }

  function restoreLog(key) {
    const record = movementsTrash[key];
    if (!record) return;
    const { deletedAt, ...clean } = record;
    fbDatabase.ref('stock_movements/' + key).set(clean)
      .then(() => fbDatabase.ref('stock_movements_trash/' + key).remove())
      .then(() => { showToast('복구 완료'); setLogTab('trash'); })
      .catch((err) => showToast('복구 실패: ' + (err && err.message ? err.message : err), true));
  }

  function permanentDeleteLog(key) {
    if (!confirm('완전히 삭제하면 복구할 수 없습니다. 정말 삭제할까요?')) return;
    fbDatabase.ref('stock_movements_trash/' + key).remove()
      .then(() => { showToast('완전 삭제되었습니다'); setLogTab('trash'); })
      .catch((err) => showToast('삭제 실패: ' + (err && err.message ? err.message : err), true));
  }

  // ===== 거래처 관리 =====
  let vendors = {};      // { key: {name, phone, addr, memo, ts} }
  let vendorLogs = {};   // { key: {vendorKey, date, type, note, ts} }
  let currentVendorKey = null;
  let vendorListenersSet = false;

  function openVendorModal() {
    document.getElementById('vendor-modal').style.display = 'flex';
    showVendorList();
    if (!vendorListenersSet) {
      vendorListenersSet = true;
      fbDatabase.ref('vendors').on('value', snap => { vendors = snap.val() || {}; renderVendorList(); if (currentVendorKey) renderVendorDetail(); });
      fbDatabase.ref('vendor_logs').on('value', snap => { vendorLogs = snap.val() || {}; renderVendorList(); if (currentVendorKey) renderVendorDetail(); });
    }
  }

  function showVendorList() {
    document.getElementById('vendor-list-view').classList.remove('hidden');
    document.getElementById('vendor-form-view').classList.add('hidden');
    document.getElementById('vendor-detail-view').classList.add('hidden');
    currentVendorKey = null;
  }
  function showVendorForm() {
    document.getElementById('vendor-list-view').classList.add('hidden');
    document.getElementById('vendor-form-view').classList.remove('hidden');
    document.getElementById('vf-name').value = ''; document.getElementById('vf-phone').value = '';
    document.getElementById('vf-addr').value = ''; document.getElementById('vf-memo').value = '';
  }
  function hideVendorForm() { showVendorList(); }
  function hideVendorDetail() { showVendorList(); }

  function lastVendorLogDate(vendorKey) {
    const logs = Object.values(vendorLogs).filter(l => l.vendorKey === vendorKey);
    if (!logs.length) return null;
    return logs.sort((a,b) => (b.ts||0)-(a.ts||0))[0];
  }

  function renderVendorList() {
    const q = (document.getElementById('vendor-search').value || '').toLowerCase();
    const box = document.getElementById('vendor-list');
    const list = Object.keys(vendors).map(key => ({ key, ...vendors[key] }))
      .filter(v => !q || (v.name||'').toLowerCase().includes(q))
      .sort((a,b) => (a.name||'').localeCompare(b.name||'', 'ko'));
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<div class="text-center py-8 text-[#B8B2A3] text-sm">등록된 거래처가 없습니다</div>'; return; }
    list.forEach(v => {
      const last = lastVendorLogDate(v.key);
      const row = document.createElement('div');
      row.className = 'bg-white border border-[var(--line)] rounded-xl p-3 flex justify-between items-center cursor-pointer active:bg-[#FBF9F5]';
      row.onclick = () => openVendorDetail(v.key);
      row.innerHTML = `
        <div class="min-w-0 flex-1">
          <p class="text-sm font-black text-[#3A342C] truncate">${v.name}</p>
          <p class="text-[14px] text-[#B8B2A3] font-bold">${v.phone||''}</p>
        </div>
        <div class="text-right shrink-0 ml-2">
          <p class="text-[13px] text-[#B8B2A3] font-bold">${last ? last.type : '기록 없음'}</p>
          <p class="text-[13px] text-[#8B5E34] font-black">${last ? last.date : '-'}</p>
        </div>
      `;
      box.appendChild(row);
    });
  }

  function saveVendor() {
    const name = document.getElementById('vf-name').value.trim();
    if (!name) return showToast('거래처명을 입력하세요');
    const record = {
      name,
      phone: document.getElementById('vf-phone').value.trim(),
      addr: document.getElementById('vf-addr').value.trim(),
      memo: document.getElementById('vf-memo').value.trim(),
      ts: Date.now()
    };
    fbDatabase.ref('vendors').push(record).then(() => { showToast('거래처 등록 완료'); showVendorList(); })
      .catch((err) => showToast('저장 실패: ' + (err && err.message ? err.message : err), true));
  }

  function openVendorDetail(key) {
    currentVendorKey = key;
    showingVendorTrash = false;
    document.getElementById('vendor-trash-toggle-btn').innerHTML = '<i class="fas fa-trash-can mr-1"></i>삭제된 기록 보기 (복구 가능)';
    document.getElementById('vendor-list-view').classList.add('hidden');
    document.getElementById('vendor-form-view').classList.add('hidden');
    document.getElementById('vendor-detail-view').classList.remove('hidden');
    document.getElementById('vl-date').value = new Date().toISOString().slice(0,10);
    document.getElementById('vl-note').value = '';
    renderVendorDetail();
  }

  function renderVendorDetail() {
    const v = vendors[currentVendorKey];
    if (!v) { showVendorList(); return; }
    document.getElementById('vd-name').innerText = v.name;
    document.getElementById('vd-phone').innerText = v.phone || '';
    document.getElementById('vd-addr').innerText = v.addr || '';
    document.getElementById('vd-memo').innerText = v.memo || '';

    if (showingVendorTrash) {
      const trashLogs = Object.keys(vendorLogsTrash).filter(k => vendorLogsTrash[k].vendorKey === currentVendorKey)
        .map(k => ({ key:k, ...vendorLogsTrash[k] })).sort((a,b) => (b.ts||0)-(a.ts||0));
      const box = document.getElementById('vendor-timeline');
      box.innerHTML = '';
      if (!trashLogs.length) { box.innerHTML = '<div class="text-center py-8 text-[#B8B2A3] text-sm">삭제된 기록이 없습니다</div>'; return; }
      trashLogs.forEach(l => {
        const row = document.createElement('div');
        row.className = 'flex gap-3';
        row.innerHTML = `
          <div class="w-1.5 shrink-0 rounded-full bg-[#E7E1D3]"></div>
          <div class="flex-1 pb-3 border-b border-slate-50">
            <div class="flex justify-between items-start">
              <div><span class="text-[13px] font-black px-1.5 py-0.5 rounded-full bg-[#F3F0EA] text-[#8B8477]">${l.type}</span><span class="text-[13px] text-[#B8B2A3] font-bold ml-1">${l.date}</span></div>
              <div class="flex gap-1"><button onclick="restoreVendorLog('${l.key}')" class="text-emerald-500 text-[13px] font-bold px-1.5 py-0.5 bg-[#F1F5F1] rounded"><i class="fas fa-rotate-left mr-0.5"></i>복구</button><button onclick="permanentDeleteVendorLog('${l.key}')" class="text-[#CFC9BB] hover:text-rose-500 text-[13px] px-1">완전삭제</button></div>
            </div>
            <p class="text-sm font-bold text-[#8B8477] mt-1">${l.note||''}</p>
          </div>
        `;
        box.appendChild(row);
      });
      return;
    }

    const logs = Object.keys(vendorLogs).filter(k => vendorLogs[k].vendorKey === currentVendorKey)
      .map(k => ({ key:k, ...vendorLogs[k] }))
      .sort((a,b) => (b.ts||0) - (a.ts||0));
    const box = document.getElementById('vendor-timeline');
    box.innerHTML = '';
    if (!logs.length) { box.innerHTML = '<div class="text-center py-8 text-[#B8B2A3] text-sm">아직 기록이 없습니다</div>'; return; }
    logs.forEach(l => {
      const row = document.createElement('div');
      row.className = 'flex gap-3';
      row.innerHTML = `
        <div class="w-1.5 shrink-0 rounded-full bg-[#D9C4A3]"></div>
        <div class="flex-1 pb-3 border-b border-slate-50">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[13px] font-black px-1.5 py-0.5 rounded-full bg-[#EFE2CF] text-[#8B5E34]">${l.type}</span>
              <span class="text-[13px] text-[#B8B2A3] font-bold ml-1">${l.date}</span>
            </div>
            <button onclick="deleteVendorLog('${l.key}')" class="text-[#CFC9BB] hover:text-rose-500 text-xs px-1"><i class="fas fa-trash"></i></button>
          </div>
          <p class="text-sm font-bold text-[#4A4238] mt-1">${l.note||''}</p>
        </div>
      `;
      box.appendChild(row);
    });
  }

  let showingVendorTrash = false;
  let vendorLogsTrash = {};
  function toggleVendorLogTrash() {
    showingVendorTrash = !showingVendorTrash;
    const btn = document.getElementById('vendor-trash-toggle-btn');
    btn.innerHTML = showingVendorTrash ? '<i class="fas fa-arrow-left mr-1"></i>전체 기록으로' : '<i class="fas fa-trash-can mr-1"></i>삭제된 기록 보기 (복구 가능)';
    if (showingVendorTrash) {
      fbDatabase.ref('vendor_logs_trash').once('value').then(snap => { vendorLogsTrash = snap.val() || {}; renderVendorDetail(); });
    } else { renderVendorDetail(); }
  }

  function addVendorLog() {
    if (!currentVendorKey) return;
    const record = {
      vendorKey: currentVendorKey,
      date: document.getElementById('vl-date').value || new Date().toISOString().slice(0,10),
      type: document.getElementById('vl-type').value,
      note: document.getElementById('vl-note').value.trim(),
      ts: Date.now()
    };
    fbDatabase.ref('vendor_logs').push(record).then(() => {
      showToast('기록 저장 완료');
      document.getElementById('vl-note').value = '';
    }).catch((err) => showToast('저장 실패: ' + (err && err.message ? err.message : err), true));
  }

  // 삭제 = 휴지통으로 이동 (복구 가능)
  function deleteVendorLog(key) {
    if (!confirm('이 기록을 휴지통으로 이동할까요?\\n(휴지통에서 언제든 복구할 수 있습니다)')) return;
    fbDatabase.ref('vendor_logs/' + key).once('value').then(snap => {
      const record = snap.val();
      if (!record) return;
      return fbDatabase.ref('vendor_logs_trash/' + key).set({ ...record, deletedAt: Date.now() })
        .then(() => fbDatabase.ref('vendor_logs/' + key).remove());
    }).then(() => showToast('휴지통으로 이동했습니다')).catch((err) => showToast('삭제 실패: ' + (err && err.message ? err.message : err), true));
  }

  function restoreVendorLog(key) {
    const record = vendorLogsTrash[key];
    if (!record) return;
    const { deletedAt, ...clean } = record;
    fbDatabase.ref('vendor_logs/' + key).set(clean)
      .then(() => fbDatabase.ref('vendor_logs_trash/' + key).remove())
      .then(() => { showToast('복구 완료'); toggleVendorLogTrash(); toggleVendorLogTrash(); })
      .catch((err) => showToast('복구 실패: ' + (err && err.message ? err.message : err), true));
  }

  function permanentDeleteVendorLog(key) {
    if (!confirm('완전히 삭제하면 복구할 수 없습니다. 정말 삭제할까요?')) return;
    fbDatabase.ref('vendor_logs_trash/' + key).remove()
      .then(() => { showToast('완전 삭제되었습니다'); fbDatabase.ref('vendor_logs_trash').once('value').then(snap => { vendorLogsTrash = snap.val() || {}; renderVendorDetail(); }); })
      .catch((err) => showToast('삭제 실패: ' + (err && err.message ? err.message : err), true));
  }

  // ===== 월별 매입 통계 =====
  let monthlyCursor = new Date(); // 현재 보고 있는 달
  function openMonthlyModal() {
    document.getElementById('monthly-modal').style.display = 'flex';
    monthlyCursor = new Date();
    renderMonthlyStats();
  }

  function shiftMonth(delta) {
    monthlyCursor.setMonth(monthlyCursor.getMonth() + delta);
    renderMonthlyStats();
  }

  function renderMonthlyStats() {
    const y = monthlyCursor.getFullYear();
    const m = monthlyCursor.getMonth(); // 0-indexed
    const monthKey = `${y}-${String(m+1).padStart(2,'0')}`;
    document.getElementById('monthly-current-label').innerText = `${y}년 ${m+1}월`;

    // 입고 건만 집계 (매입 지출 기준)
    const records = Object.values(movements).filter(r => r.type === '입고' && r.date && r.date.startsWith(monthKey));

    let totalAmount = 0, totalQty = 0;
    const byBrand = {};
    records.forEach(r => {
      const qty = Number(r.qty) || 0;
      const price = Number(r.price) || 0;
      const amount = qty * price;
      totalAmount += amount;
      totalQty += qty;
      const b = r.brand || '미분류';
      if (!byBrand[b]) byBrand[b] = { amount: 0, qty: 0, count: 0 };
      byBrand[b].amount += amount;
      byBrand[b].qty += qty;
      byBrand[b].count += 1;
    });

    document.getElementById('monthly-total-amount').innerText = totalAmount.toLocaleString() + '원';
    document.getElementById('monthly-total-qty').innerText = `${totalQty.toLocaleString()} BOX · ${records.length}건`;

    const brandList = document.getElementById('monthly-brand-list');
    brandList.innerHTML = '';
    const brands = Object.keys(byBrand).sort((a,b) => byBrand[b].amount - byBrand[a].amount);
    if (!brands.length) {
      brandList.innerHTML = '<div class="text-center py-8 text-[#B8B2A3] text-sm">이 달 입고 기록이 없습니다</div>';
      return;
    }
    const maxAmount = Math.max(...brands.map(b => byBrand[b].amount), 1);
    brands.forEach(b => {
      const d = byBrand[b];
      const pct = Math.max(4, Math.round((d.amount / maxAmount) * 100));
      const color = getBrandColor(b);
      const row = document.createElement('div');
      row.className = 'rounded-xl border border-[var(--line)] p-3.5';
      row.style.borderLeft = `5px solid ${color}`;
      row.innerHTML = `
        <div class="flex justify-between items-baseline mb-1.5">
          <span class="text-[16px] font-black" style="color:${color}">${b}</span>
          <span class="text-base font-black text-[#3A342C] num">${d.amount.toLocaleString()}원</span>
        </div>
        <div class="h-2 rounded-full bg-[#F3F0EA] overflow-hidden mb-1.5">
          <div class="h-full rounded-full" style="width:${pct}%;background:${color}"></div>
        </div>
        <p class="text-[13px] text-[#B8B2A3] font-bold">${d.qty.toLocaleString()} BOX · ${d.count}건</p>
      `;
      brandList.appendChild(row);
    });
  }
</script>
</body>
</html>
