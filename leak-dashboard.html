<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적 관리 - 청인마루</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  :root{
    --page-bg:#eef0f3; --paper:#ffffff; --ink:#1a1d23; --ink-soft:#4b515c; --ink-faint:#889099;
    --brand:#1f3864; --brand-2:#2f5496; --accent-bg:#eef2fb; --line:#d9dde4;
    --shadow: 0 8px 24px rgba(20,24,33,.10);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--page-bg); color:var(--ink); font-family:'Noto Sans KR','Malgun Gothic',sans-serif; padding:28px 16px 60px; }
  .wrap{ max-width:1220px; margin:0 auto; }

  #gate{ max-width:360px; margin:120px auto; background:#fff; border-radius:12px; box-shadow:var(--shadow); padding:32px 28px; text-align:center; }
  #gate h1{ font-size:16px; color:var(--brand); margin:0 0 6px; }
  #gate p{ font-size:12px; color:var(--ink-faint); margin:0 0 18px; }
  #gate input{ width:100%; padding:11px 12px; font-size:14px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; font-family:inherit; }
  #gate button{ width:100%; padding:11px; font-size:14px; font-weight:700; background:var(--brand); color:#fff; border:none; border-radius:8px; cursor:pointer; }
  #gate .err{ color:#c0392b; font-size:12px; margin-top:8px; display:none; }
  #gate .hint2{ font-size:11px; color:var(--ink-faint); margin-top:14px; }

  header.top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  header.top .title{ font-size:19px; font-weight:900; color:var(--brand); }
  header.top .title small{ display:block; font-size:11.5px; color:var(--ink-faint); font-weight:400; margin-top:2px;}
  header.top .btns{ display:flex; gap:8px; }
  header.top a.new-btn{ background:var(--brand); color:#fff; text-decoration:none; padding:11px 18px; border-radius:8px; font-weight:700; font-size:13px; box-shadow:var(--shadow); }
  header.top a.new-btn.alt{ background:#fff; color:var(--brand); border:1px solid var(--line); box-shadow:none; }

  .stats{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:18px; }
  .stat-card{ background:#fff; border-radius:10px; box-shadow:var(--shadow); padding:16px 18px; }
  .stat-card .lbl{ font-size:11.5px; color:var(--ink-faint); font-weight:700; margin-bottom:6px;}
  .stat-card .val{ font-size:19px; font-weight:900; color:var(--brand); font-variant-numeric:tabular-nums;}

  .filter-bar{ background:#fff; border-radius:10px; box-shadow:var(--shadow); padding:14px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .filter-bar input, .filter-bar select{ font-family:inherit; font-size:13px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .filter-bar input#searchBox{ flex:1; min-width:220px; }
  .filter-bar .count{ margin-left:auto; font-size:12px; color:var(--ink-faint); }
  .filter-bar .search-hint{ width:100%; font-size:11px; color:var(--ink-faint); }

  table.list{ width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:var(--shadow); font-size:13px; }
  table.list th{ background:var(--brand-2); color:#fff; text-align:left; font-weight:700; padding:11px 12px; white-space:nowrap; }
  table.list td{ padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.list tr:hover td{ background:var(--accent-bg); }
  table.list td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.list td.addr{ color:var(--ink-soft); font-size:12.5px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .type-badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; }
  .type-badge.leak{ background:#e8f0fd; color:#1f5fc0; }
  .type-badge.trade{ background:#f0eafd; color:#5b2fc0; }
  .type-badge.consumer{ background:#fff0df; color:#9a6330; }
  .type-badge.client{ background:#eef7f1; color:#32704b; }
  .type-badge.consumer{ background:#fff0df; color:#9a6330; }

  .badge{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .badge.작성중{ background:#eef0f3; color:#4b515c; }
  .badge.발송됨, .badge.거래처.발송됨{ background:#e8f0fd; color:#1f5fc0; }
  .badge.고객확인, .badge.확인됨{ background:#eef8ee; color:#1f7a3d; }
  .badge.계약전환{ background:#fff4e0; color:#a3660a; }
  .badge.보류{ background:#fdf1e0; color:#a35c0a; }
  .badge.취소{ background:#fbe9e9; color:#a32e2e; }

  select.statusSelect{ font-size:11.5px; padding:4px 6px; border-radius:6px; border:1px solid var(--line); }
  a.openLink{ color:var(--brand-2); font-weight:700; text-decoration:none; font-size:12.5px; border:1px solid var(--line); padding:6px 10px; border-radius:6px; white-space:nowrap; }
  a.openLink:hover{ background:var(--accent-bg); }
  .rowActions{ display:flex; gap:6px; align-items:center; }
  button.deleteBtn{ font-family:inherit; font-size:12px; font-weight:700; color:#9a3f3f; background:#fff; border:1px solid #e0c6c6; border-radius:6px; padding:6px 9px; cursor:pointer; white-space:nowrap; }
  button.deleteBtn:hover{ background:#fff6f6; }
  button.trashBtn{ font-family:inherit; font-size:12px; font-weight:800; color:#7b4b4b; background:#fff; border:1px solid #dfcaca; border-radius:8px; padding:10px 13px; cursor:pointer; }
  .trash-overlay{ position:fixed; inset:0; background:rgba(20,24,33,.55); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px; }
  .trash-card{ width:min(900px,96vw); max-height:88vh; overflow:auto; background:#fff; border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.25); padding:22px; }
  .trash-head{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:12px; }
  .trash-title{ font-size:19px; font-weight:900; color:var(--brand); }
  .trash-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }
  .trash-close{ border:none; background:#eef0f3; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:18px; }
  .trash-row{ display:grid; grid-template-columns:100px 150px minmax(0,1fr) 115px auto auto; gap:10px; align-items:center; border-top:1px solid var(--line); padding:11px 0; font-size:11.5px; }
  .trash-row:first-child{ border-top:none; }
  .trash-main{ min-width:0; }
  .trash-main b,.trash-main span{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trash-main span{ color:var(--ink-faint); margin-top:2px; }
  .trash-action{ font-family:inherit; font-size:11px; font-weight:800; padding:6px 9px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .trash-action.restore{ color:var(--brand-2); background:#f5f8fc; border:1px solid #cbd9e9; }
  .trash-action.purge{ color:#9a3f3f; background:#fff; border:1px solid #e0c6c6; }
  @media(max-width:980px){ .stats{ grid-template-columns:repeat(3,1fr); } }
  @media(max-width:700px){ .stats{ grid-template-columns:repeat(2,1fr); } .trash-row{ grid-template-columns:1fr auto auto; } .trash-row .hideMobile{ display:none; } }
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-faint); font-size:13px; }
</style>
</head>
<body>

<div id="staffBadge" style="display:none; position:fixed; top:10px; right:10px; z-index:99999; background:#fff; border:1px solid #e4e0d8; border-radius:20px; padding:6px 12px; font-size:12px; color:#555; box-shadow:0 2px 6px rgba(0,0,0,.08); align-items:center; gap:8px;">
  <span id="staffBadgeEmail"></span>
  <button onclick="firebase.auth().signOut()" style="border:none;background:#f3f0ea;border-radius:12px;padding:3px 10px;font-size:11px;cursor:pointer;color:#a05a12;font-weight:700;">로그아웃</button>
</div>

<div id="gate">
  <h1>🔒 청인마루 직원 전용</h1>
  <p>견적 목록에 접근하려면 직원 계정으로 로그인하세요.</p>
  <input type="email" id="gateEmail" placeholder="이메일">
  <input type="password" id="gatePw" placeholder="비밀번호">
  <button onclick="checkGate()">입장</button>
  <div class="err" id="gateErr">이메일 또는 비밀번호가 올바르지 않습니다.</div>
</div>

<div class="wrap" id="mainWrap" style="display:none;">
  <header class="top">
    <div class="title">견적 관리
      <small>누수복구·거래처용·소비자용 견적서를 한 곳에서 검색하고 관리하세요</small>
    </div>
    <div class="btns">
      <button type="button" class="trashBtn" onclick="openTrash()">🗑 휴지통 <span id="trashCount"></span></button>
      <a class="new-btn alt" href="leak-estimate.html?tab=trade">＋ 일반 견적</a>
      <a class="new-btn" href="leak-estimate.html?tab=leak">＋ 누수복구 견적</a>
    </div>
  </header>

  <div class="stats">
    <div class="stat-card"><div class="lbl">전체 견적 건수</div><div class="val" id="statTotal">0</div></div>
    <div class="stat-card"><div class="lbl">누수복구</div><div class="val" id="statLeak">0</div></div>
    <div class="stat-card"><div class="lbl">거래처용</div><div class="val" id="statTrade">0</div></div>
    <div class="stat-card"><div class="lbl">소비자용</div><div class="val" id="statConsumer">0</div></div>
    <div class="stat-card"><div class="lbl">이번 달 신규</div><div class="val" id="statMonth">0</div></div>
    <div class="stat-card"><div class="lbl">이번 달 합계금액</div><div class="val" id="statAmount">0원</div></div>
  </div>

  <div class="filter-bar">
    <input id="searchBox" placeholder="🔍 고객명 · 거래처 · 현장주소 · 견적번호 · 연락처 일부 · 제품명 검색">
    <select id="typeFilter">
      <option value="">전체 유형</option>
      <option value="leak">🌊 누수복구</option>
      <option value="trade">📦 거래처용</option>
      <option value="consumer">👤 소비자용</option>
      <option value="client">🏢 등록 거래처</option>
    </select>
    <select id="statusFilter">
      <option value="">전체 상태</option>
      <option value="작성중">작성중</option>
      <option value="발송됨">발송됨</option>
      <option value="고객확인">고객/거래처 확인</option>
      <option value="확인됨">확인됨</option>
      <option value="계약전환">계약 전환</option>
      <option value="보류">보류</option>
      <option value="취소">취소</option>
    </select>
    <select id="sortSelect">
      <option value="date_desc">최신 수정순</option>
      <option value="date_asc">오래된순</option>
      <option value="amount_desc">금액 높은순</option>
      <option value="amount_asc">금액 낮은순</option>
    </select>
    <span class="count" id="resultCount"></span>
    <div class="search-hint">예: "청인" "ㅊㅇㅁㄹ" "5294" "미네랄"처럼 일부만 입력해도 찾습니다.</div>
  </div>

  <table class="list">
    <thead>
      <tr>
        <th>유형</th><th>견적번호</th><th>고객명/거래처</th><th>현장주소</th>
        <th>발행일</th><th class="num">합계금액</th><th>담당자</th><th>상태</th><th></th>
      </tr>
    </thead>
    <tbody id="listBody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">저장된 견적이 없습니다. 상단의 버튼으로 새 견적을 시작하세요.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
/* ⚠️ leak-estimate.html과 동일한 firebaseConfig 값을 넣어주세요. */
const firebaseConfig = {
  apiKey: "AIzaSyCHdMgp2clJ0y3L1GR-WubpAYKEVYvLcLA",
  authDomain: "maru-quote-history.firebaseapp.com",
  databaseURL: "https://maru-quote-history-default-rtdb.firebaseio.com",
  projectId: "maru-quote-history",
  storageBucket: "maru-quote-history.firebasestorage.app",
  messagingSenderId: "936179721364",
  appId: "1:936179721364:web:cbf9e9bb6c71970d400081"
};

let db = null;
let authReadyPromise = Promise.resolve(null);
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  authReadyPromise = new Promise(function(resolve){
    firebase.auth().onAuthStateChanged(function(user){
      if (user && !user.isAnonymous) {
        resolve(user);
        enterDashboard(user);
      } else {
        document.getElementById('gate').style.display = 'block';
        document.getElementById('mainWrap').style.display = 'none';
        document.getElementById('staffBadge').style.display = 'none';
        if (user && user.isAnonymous) {
          // 예전 코드가 남겨둔 익명 로그인 흔적 — 로그아웃시켜서 반드시 실제 로그인을 거치게 함
          firebase.auth().signOut();
        }
      }
    });
  });
}catch(e){ console.warn('Firebase 초기화 실패', e); }

let allRows = [];
let trashRows = [];

/* ===== 게이트: 실제 직원 계정(이메일+비밀번호) 로그인 ===== */
function checkGate(){
  var email = document.getElementById('gateEmail').value.trim();
  var pw = document.getElementById('gatePw').value;
  document.getElementById('gateErr').style.display = 'none';
  firebase.auth().signInWithEmailAndPassword(email, pw)
    .catch(function(err){
      console.error('로그인 실패', err);
      document.getElementById('gateErr').style.display = 'block';
    });
  // 로그인 성공 시 화면 전환·startListening() 호출은 위 onAuthStateChanged가 처리합니다.
}
window.checkGate = checkGate;
function enterDashboard(user){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  document.getElementById('staffBadgeEmail').textContent = user.email;
  document.getElementById('staffBadge').style.display = 'flex';
  startListening();
}
document.getElementById('gatePw').addEventListener('keydown', function(e){ if(e.key==='Enter') checkGate(); });

/* ===== 검색 유틸 (공백 무관 + 초성검색) ===== */
var CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function toChosung(str){
  var out = '';
  for(var i=0;i<String(str||'').length;i++){
    var ch = str[i];
    var code = ch.charCodeAt(0) - 0xAC00;
    if(code >= 0 && code <= 11171){ out += CHO[Math.floor(code/588)]; }
    else if(/[ㄱ-ㅎ]/.test(ch)){ out += ch; }
  }
  return out;
}
function normalizeForSearch(str){ return String(str||'').replace(/\s+/g,'').toLowerCase(); }
function matchesQuery(haystack, query){
  var hNorm = normalizeForSearch(haystack), qNorm = normalizeForSearch(query);
  if(!qNorm) return true;
  if(hNorm.indexOf(qNorm) !== -1) return true;
  var hCho = toChosung(haystack), qCho = toChosung(query);
  if(qCho && hCho.indexOf(qCho) !== -1) return true;
  return false;
}

function fmtWon(n){ return Math.round(n||0).toLocaleString('ko-KR') + '원'; }

function startListening(){
  if(!db){
    document.getElementById('listBody').innerHTML = '<tr><td colspan="9" style="padding:30px;text-align:center;color:#c0392b;">Firebase 설정이 필요합니다 (firebaseConfig 확인)</td></tr>';
    return;
  }
  document.getElementById('listBody').innerHTML = '<tr><td colspan="9" style="padding:30px;text-align:center;color:#889099;">로그인 확인 중...</td></tr>';
  authReadyPromise.then(function(){
    var leakRows = {}, tradeRows = {};
    var bothLoaded = { leak:false, trade:false };

    function rebuild(){
      var active = [], deleted = [];
      Object.keys(leakRows).forEach(function(id){
        var row = toRow(id, leakRows[id], 'leak');
        (row.deletedAt ? deleted : active).push(row);
      });
      Object.keys(tradeRows).filter(function(id){ return id !== '__clients'; }).forEach(function(id){
        var row = toRow(id, tradeRows[id], 'trade');
        (row.deletedAt ? deleted : active).push(row);
      });
      var clientMap = tradeRows.__clients || {};
      Object.keys(clientMap).forEach(function(id){
        active.push(toClientRow(id, clientMap[id] || {}));
      });
      allRows = active;
      trashRows = deleted.sort(function(a,b){ return (b.deletedAt||0)-(a.deletedAt||0); });
      render();
      updateTrashCount();
    }

    db.ref('leak_estimates').on('value', function(snap){
      leakRows = snap.val() || {}; bothLoaded.leak = true; rebuild();
    }, function(err){
      console.error(err);
      document.getElementById('listBody').innerHTML = '<tr><td colspan="9" style="padding:30px;text-align:center;color:#c0392b;">leak_estimates를 불러오지 못했습니다 (규칙/로그인 확인)</td></tr>';
    });
    db.ref('b2b_estimates').on('value', function(snap){
      tradeRows = snap.val() || {}; bothLoaded.trade = true; rebuild();
    }, function(err){
      console.error(err);
      // b2b_estimates 규칙이 아직 없을 수 있음 - 조용히 무시하고 누수 견적만 표시
    });
  });
}

function toRow(id, rec, type){
  var meta = rec.meta || {};
  var docData = rec.docData || {};
  var recipientType = type === 'trade' ? (docData['tr-recipient-type'] || meta.recipientType || '거래처') : '';
  var docType = type === 'trade' && recipientType === '소비자' ? 'consumer' : type;
  var itemSearch = '';
  if(type === 'trade'){
    itemSearch = (rec.items || []).map(function(it){ return [it.name,it.spec,it.note].filter(Boolean).join(' '); }).join(' ');
  } else {
    (rec.items || []).forEach(function(g){ (g.items || []).forEach(function(it){ itemSearch += ' ' + [it.item,it.name,it.spec,it.note].filter(Boolean).join(' '); }); });
  }
  return {
    id: id,
    sourceType: type,
    docType: docType,
    estimateNo: meta.estimateNo || (type==='trade' ? docData['tr-est-no'] : docData['est-no']) || id,
    customerName: (meta.customerName || (type==='trade' ? docData['tr-customer'] : docData['est-customer']) || '').replace(/\[.*?\]/g,'').replace(/귀하$/,'').trim() || '(미입력)',
    clientChannel: meta.clientChannel || '',
    address: (meta.address || (type==='trade' ? docData['tr-site'] : docData['est-address']) || '').replace(/\[.*?\]/g,'').trim() || '-',
    phone: meta.phone || (type==='trade' ? docData['tr-ref-phone'] : docData['est-phone']) || '',
    issueDate: meta.issueDate || (type==='trade' ? docData['tr-date'] : docData['est-date']) || '',
    grandTotal: meta.grandTotal || 0,
    manager: meta.manager || '-',
    status: meta.status || '작성중',
    updatedAt: meta.updatedAt || 0,
    deletedAt: meta.deletedAt || 0,
    itemSearch: itemSearch
  };
}

function toClientRow(id, rec){
  return {
    id:id,
    sourceType:'client',
    docType:'client',
    estimateNo:'거래처 등록',
    customerName:rec.name || '(미입력)',
    clientChannel:'',
    address:rec.address || '-',
    phone:rec.phone || '',
    issueDate:'',
    grandTotal:0,
    manager:rec.manager || '-',
    status:'등록',
    updatedAt:rec.updatedAt || rec.createdAt || 0,
    deletedAt:0,
    itemSearch:[rec.name,rec.manager,rec.phone,rec.address].filter(Boolean).join(' ')
  };
}

function updateStatus(id, sourceType, newStatus){
  if(!db) return;
  var node = sourceType === 'trade' ? 'b2b_estimates' : 'leak_estimates';
  authReadyPromise.then(function(){
    db.ref(node + '/' + id + '/meta').update({ status: newStatus, updatedAt: Date.now() });
  });
}
window.updateStatus = updateStatus;

function render(){
  var q = document.getElementById('searchBox').value.trim();
  var typeF = document.getElementById('typeFilter').value;
  var statusF = document.getElementById('statusFilter').value;
  var sortV = document.getElementById('sortSelect').value;

  var rows = allRows.filter(function(r){
    if(typeF && r.docType !== typeF) return false;
    if(statusF && r.status !== statusF) return false;
    if(!q) return true;
    var hay = [r.customerName, r.clientChannel, r.address, r.estimateNo, r.phone, r.manager, r.itemSearch].join(' ');
    return matchesQuery(hay, q);
  });

  rows.sort(function(a,b){
    if(sortV === 'date_desc') return (b.updatedAt||0) - (a.updatedAt||0);
    if(sortV === 'date_asc') return (a.updatedAt||0) - (b.updatedAt||0);
    if(sortV === 'amount_desc') return (b.grandTotal||0) - (a.grandTotal||0);
    if(sortV === 'amount_asc') return (a.grandTotal||0) - (b.grandTotal||0);
    return 0;
  });

  document.getElementById('resultCount').textContent = rows.length + '건 표시 중 (견적 ' + allRows.filter(function(r){return r.docType!=='client';}).length + '건 · 등록 거래처 ' + allRows.filter(function(r){return r.docType==='client';}).length + '곳)';

  var tbody = document.getElementById('listBody');
  if(rows.length === 0){
    tbody.innerHTML = '';
    document.getElementById('emptyMsg').style.display = 'block';
  } else {
    document.getElementById('emptyMsg').style.display = 'none';
    tbody.innerHTML = rows.map(function(r){
      var statuses = r.docType === 'leak'
        ? ['작성중','발송됨','고객확인','계약전환','보류','취소']
        : ['작성중','발송됨','확인됨','계약전환','보류','취소'];
      var opts = statuses.map(function(s){ return '<option value="'+s+'"'+(s===r.status?' selected':'')+'>'+s+'</option>'; }).join('');
      var typeLabel = r.docType === 'trade' ? '<span class="type-badge trade">📦 거래처용</span>' : (r.docType === 'consumer' ? '<span class="type-badge consumer">👤 소비자용</span>' : (r.docType === 'client' ? '<span class="type-badge client">🏢 등록 거래처</span>' : '<span class="type-badge leak">🌊 누수복구</span>'));
      var statusCell = r.docType === 'client' ? '<span class="badge 확인됨">등록</span>' : '<select class="statusSelect" onchange="updateStatus(\''+r.id+'\',\''+r.sourceType+'\', this.value)">'+opts+'</select>';
      var actionCell = r.docType === 'client'
        ? '<div class="rowActions"><a class="openLink" href="leak-estimate.html?tab=trade&client='+encodeURIComponent(r.id)+'">견적작성 →</a></div>'
        : '<div class="rowActions"><a class="openLink" href="leak-estimate.html?tab='+(r.sourceType==='trade'?'trade':'leak')+'&id='+encodeURIComponent(r.id)+'">열기 →</a><button class="deleteBtn" onclick="moveToTrash(\''+r.sourceType+'\',\''+r.id+'\')">삭제</button></div>';
      return '<tr>' +
        '<td>'+typeLabel+'</td>' +
        '<td>'+esc(r.estimateNo)+'</td>' +
        '<td>'+esc(r.customerName)+(r.phone?(' <span style="color:#889099;font-size:11px;">'+esc(r.phone)+'</span>'):'')+'</td>' +
        '<td class="addr" title="'+esc(r.address)+'">'+esc(r.address)+'</td>' +
        '<td>'+esc(r.issueDate || '-')+'</td>' +
        '<td class="num">'+(r.docType==='client' ? '-' : fmtWon(r.grandTotal))+'</td>' +
        '<td>'+esc(r.manager)+'</td>' +
        '<td>'+statusCell+'</td>' +
        '<td>'+actionCell+'</td>' +
        '</tr>';
    }).join('');
  }

  document.getElementById('statTotal').textContent = allRows.filter(function(r){ return r.docType!=='client'; }).length;
  document.getElementById('statLeak').textContent = allRows.filter(function(r){ return r.docType==='leak'; }).length;
  document.getElementById('statTrade').textContent = allRows.filter(function(r){ return r.docType==='trade'; }).length;
  document.getElementById('statConsumer').textContent = allRows.filter(function(r){ return r.docType==='consumer'; }).length;
  var now = new Date();
  var ym = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  var monthRows = allRows.filter(function(r){ return r.docType!=='client' && (r.issueDate||'').indexOf(ym) === 0; });
  document.getElementById('statMonth').textContent = monthRows.length;
  var monthSum = monthRows.reduce(function(s,r){ return s + (r.grandTotal||0); }, 0);
  document.getElementById('statAmount').textContent = fmtWon(monthSum);
}


function nodeFor(sourceType){ return sourceType === 'trade' ? 'b2b_estimates' : 'leak_estimates'; }
function updateTrashCount(){
  var el=document.getElementById('trashCount');
  if(el) el.textContent=trashRows.length ? '('+trashRows.length+')' : '';
}
function moveToTrash(sourceType,id){
  var r=allRows.find(function(x){ return x.sourceType===sourceType && x.id===id; });
  if(!confirm('['+(r ? r.estimateNo : id)+'] 견적을 휴지통으로 이동할까요?\n휴지통에서 다시 복구할 수 있습니다.')) return;
  authReadyPromise.then(function(){
    return db.ref(nodeFor(sourceType)+'/'+id+'/meta').update({deletedAt:Date.now(),updatedAt:Date.now()});
  });
}
window.moveToTrash=moveToTrash;
function openTrash(){
  var old=document.getElementById('trashOverlay'); if(old) old.remove();
  var overlay=document.createElement('div'); overlay.id='trashOverlay'; overlay.className='trash-overlay';
  overlay.innerHTML='<div class="trash-card"><div class="trash-head"><div><div class="trash-title">휴지통</div><div class="trash-sub">삭제한 견적을 복구하거나 완전히 삭제할 수 있습니다.</div></div><button class="trash-close" onclick="document.getElementById(\'trashOverlay\').remove()">×</button></div><div id="trashList"></div></div>';
  overlay.addEventListener('click',function(e){ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay); renderTrash();
}
window.openTrash=openTrash;
function renderTrash(){
  var box=document.getElementById('trashList'); if(!box) return;
  if(!trashRows.length){ box.innerHTML='<div class="empty">휴지통이 비어 있습니다.</div>'; return; }
  box.innerHTML=trashRows.map(function(r){
    var label=r.docType==='trade'?'거래처용':(r.docType==='consumer'?'소비자용':'누수복구');
    return '<div class="trash-row"><span class="hideMobile">'+label+'</span><span class="hideMobile">'+esc(r.estimateNo)+'</span><div class="trash-main"><b>'+esc(r.customerName)+'</b><span>'+esc(r.address)+'</span></div><span class="hideMobile">'+new Date(r.deletedAt).toLocaleDateString('ko-KR')+'</span><button class="trash-action restore" onclick="restoreFromTrash(\''+r.sourceType+'\',\''+r.id+'\')">복구</button><button class="trash-action purge" onclick="purgeFromTrash(\''+r.sourceType+'\',\''+r.id+'\')">완전삭제</button></div>';
  }).join('');
}
function restoreFromTrash(sourceType,id){
  authReadyPromise.then(function(){ return db.ref(nodeFor(sourceType)+'/'+id+'/meta').update({deletedAt:null,updatedAt:Date.now()}); }).then(function(){ setTimeout(renderTrash,150); });
}
function purgeFromTrash(sourceType,id){
  var r=trashRows.find(function(x){ return x.sourceType===sourceType && x.id===id; });
  if(!confirm('['+(r ? r.estimateNo : id)+'] 견적을 완전히 삭제할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
  authReadyPromise.then(function(){ return db.ref(nodeFor(sourceType)+'/'+id).remove(); }).then(function(){ setTimeout(renderTrash,150); });
}
window.restoreFromTrash=restoreFromTrash;
window.purgeFromTrash=purgeFromTrash;

function esc(s){
  return String(s || '').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('statusFilter').addEventListener('change', render);
document.getElementById('sortSelect').addEventListener('change', render);
</script>
</body>
